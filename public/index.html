<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Killer Keys — Tip &amp; Request App</title>
<style>
:root{--gold:#f5b942;--gold-dim:#c98f2b;--bg:#000;--panel:#111;--panel2:#1a1a1a;--line:#2a2a2a;--text:#f2ede6;--muted:#a8a29a;--green:#22c55e;--red:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--gold)}
header{padding:14px 20px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.04em;font-size:22px;white-space:nowrap}
.logo b{color:var(--gold)}
.sub{color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.viewas{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;letter-spacing:.1em}
.viewas button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:99px;padding:7px 16px;font-weight:700;cursor:pointer}
.viewas button.on{background:var(--green);border-color:var(--green);color:#000}
body.fan .perf{display:none!important}
.badge{background:var(--gold);color:#000;font-weight:800;font-size:11px;padding:3px 10px;border-radius:99px;letter-spacing:.06em}
nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line)}
nav button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:99px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:14px}
nav button.on{background:#fff;color:#000;border-color:#fff}
nav button.gold{background:var(--gold);color:#000;border-color:var(--gold)}
nav button:hover{border-color:var(--gold)}
main{max-width:1000px;margin:0 auto;padding:18px 20px 80px}
h1{font-size:44px;line-height:1.05;margin:8px 0 10px;font-weight:900;letter-spacing:.01em}
h1 span{color:var(--gold)}
.lede{color:var(--muted);font-size:15px;line-height:1.55;max-width:720px}
.lede b{color:var(--text)}
.search{display:flex;gap:8px;margin:18px 0 12px}
.search input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:13px 16px;font-size:16px}
.search input:focus{outline:2px solid var(--gold)}
.search button{background:var(--panel);border:1px solid var(--gold);color:var(--gold);border-radius:12px;padding:0 16px;font-weight:700;cursor:pointer}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:99px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px}
.filters button.on{background:var(--gold);color:#000;border-color:var(--gold)}
.song{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.song:hover{border-color:var(--gold)}
.song .tt{font-weight:800;font-size:17px}
.song .aa{color:var(--muted);font-size:13px;margin-top:2px}
.song .tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:#2b2b2b;border:1px solid #3a3a3a;border-radius:6px;padding:2px 7px;color:#ffd479}
.tag.banger{background:#3a2a00;border-color:#6b4d00}
.tag.country{background:#1d2b1d;border-color:#2f5a2f}
.song .star{color:var(--gold);font-size:18px}
.song .chev{margin-left:auto;color:var(--gold);font-size:22px;font-weight:800}
.song .min{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h2{margin:0 0 12px;font-size:22px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=number],textarea,select{width:100%;background:#0d0d0d;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px 12px;font-size:15px}
textarea{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace}
.btn{background:var(--gold);color:#000;border:0;border-radius:99px;padding:11px 22px;font-weight:800;cursor:pointer;font-size:15px}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--red);color:#fff}
.btnrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.chartbox{background:#000;color:#fff;border:1px solid #222;border-radius:10px;padding:16px 18px;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;font-size:19px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;-webkit-user-select:text;user-select:text;tab-size:4;-webkit-text-size-adjust:100%;touch-action:pan-y}
.chartbox div,.chartbox p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:transparent}
.notebar{position:static;margin-bottom:8px}
.tagpick{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px;align-items:center}
.tagchip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:99px;padding:9px 15px;font-weight:700;cursor:pointer;font-size:14px;min-height:38px}
.tagchip.on{background:var(--gold);color:#000;border-color:var(--gold)}
.tagchip.add{border-style:dashed;color:var(--muted)}
.tagother{display:inline-flex;gap:6px;align-items:center}.tagother[hidden]{display:none}
.tagother input{width:130px;padding:8px 10px;margin:0}
#aNote{min-height:180px}
.chartbox:empty::before{content:attr(data-empty);color:var(--muted);font-weight:600}
.chartbox.editing{outline:2px dashed var(--gold);outline-offset:3px;cursor:text;caret-color:#feff0a}
.chartbox ::selection{background:rgba(80,140,255,.55)}
.charthead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.lockstat{font-size:13px;font-weight:800;color:var(--green);margin-left:auto}
.lockstat.dirty{color:var(--gold)}
.small-btn{padding:7px 14px;font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;position:sticky;top:0;z-index:5}
/* Chart uses the full screen width on wide displays. The 1000px main column leaves
   ~2 inches of black on each side of the chart on a laptop — wasted space the lyrics
   could use, so the text can be bigger without wrapping to another line. On phones
   the main column is already full-width, so this only kicks in above 1040px
   (1000px column + 20px padding each side). */
@media (min-width: 1041px){
  .charthead, .toolbar, #chartBox{width:calc(100vw - 40px);margin-left:calc(50% - 50vw + 20px)}
}
.toolbar select{width:auto;max-width:260px;padding:8px 10px;font-size:14px}
.toolbar .tbl{display:flex;align-items:center;gap:6px;margin:0;font-size:12px;color:var(--muted);font-weight:700}
.toolbar input[type=range]{width:90px;accent-color:var(--gold)}
.toolbar .tbl span{min-width:18px;color:var(--text)}
.tbb{background:#0d0d0d;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-weight:700;cursor:pointer;font-size:13px}
.tbb:hover{border-color:var(--gold)}
.swatches{display:flex;gap:5px}
.sw{width:24px;height:24px;border-radius:6px;border:2px solid #333;cursor:pointer;padding:0}
.toolbar.locked .edit-only{opacity:.35}
.slcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.slhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.viewers{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tog{min-width:52px;border:1px solid var(--line);background:#2a2a2a;color:var(--muted);border-radius:99px;padding:6px 10px;font-weight:900;font-size:12px;cursor:pointer}
.tog.on{background:var(--green);border-color:var(--green);color:#000}
.btn.sm{padding:7px 14px;font-size:13px}
.iconbtn{background:none;border:0;font-size:20px;cursor:pointer;padding:2px 4px}
.iconbtn.dim{opacity:.25;cursor:default}
.slrow .c{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.slrow.is-off .n,.slrow.is-off .small{opacity:.4;text-decoration:line-through}
.qtip{display:inline-block;background:var(--green);color:#000;border-radius:7px;padding:1px 7px;font-size:13px;font-weight:900;margin-left:6px;vertical-align:2px}
#topnav button.fanbtn{border-color:#2f6b3f;color:#8ff07a}
#topnav button.fanbtn.on{background:#58f339;color:#000;border-color:#58f339}
.tipopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.tipopt{background:#101013;border:2px solid var(--line);color:var(--text);border-radius:14px;padding:14px 12px;min-height:72px;text-align:left;cursor:pointer;font:inherit}
.tipopt b{display:block;font-size:20px;font-weight:900}
.tipopt small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.35}
.tipopt.on{border-color:var(--gold);background:#241b05}
.tipopt.on b{color:var(--gold)}
.tipcustom{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.tipcustom[hidden]{display:none !important}
.tipcustom .amt{display:flex;align-items:center;gap:6px;background:#101013;border:1px solid var(--line);border-radius:10px;padding:0 12px;min-height:46px}
.tipcustom input{background:transparent;border:0;outline:0;color:var(--text);font-size:17px;width:90px;padding:10px 0}
.tipnow{margin-top:16px;background:#12351f;border:1px solid #2f6b3f;color:#cdeac2;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5}
.tipnow b{color:#8ff07a}
.tipnote{margin-top:12px;color:var(--muted);font-size:13.5px;line-height:1.45}
.an-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 18px}
@media(min-width:700px){.an-stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.an-stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.an-stat b{display:block;font-size:26px;font-weight:900;letter-spacing:.01em;line-height:1.15}
.an-stat span{color:var(--muted);font-size:12.5px;font-weight:600}
.an-sort{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.an-sort button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:99px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:14px;min-height:38px}
.an-sort button.on{background:var(--gold);color:#000;border-color:var(--gold)}
.an-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px}
.an-row .n{font-weight:800;font-size:16px;line-height:1.25;min-width:0}
.an-row .c{text-align:right;white-space:nowrap;font-weight:800;flex:none}
.an-row .c b{color:var(--gold);display:block}
.an-row .kind{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.an-night{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.an-empty{color:var(--muted);padding:28px 8px;font-size:16px;line-height:1.5}
.ownmins{margin-top:10px}
.ownmins .setlist-row .c b{color:var(--gold)}
.fanstage{display:flex;flex-direction:column;align-items:center;gap:12px}
.fanbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;width:100%}
.phone{position:relative;width:390px;height:844px;border-radius:48px;border:12px solid #1b1b1f;box-shadow:0 0 0 2px #333,0 20px 60px rgba(0,0,0,.6);overflow:hidden;background:#0a0a0c;transform-origin:top left}
.phone iframe{width:100%;height:calc(100% - 26px);margin-top:26px;border:0;display:block;background:#0a0a0c}
.phone .notch{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:110px;height:18px;border-radius:12px!important;background:#000;z-index:2;pointer-events:none}
.phonebox{position:relative}
.ovgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
.ovgrid>*{min-width:0}
#ovVisible{accent-color:var(--gold)}
.ov-stage{position:relative;aspect-ratio:16/9;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:repeating-conic-gradient(#151515 0 25%,#1d1d1d 0 50%) 0 0/24px 24px;padding:16px}
.ov-stage.solo{aspect-ratio:auto;height:100vh;border:0;border-radius:0;background:transparent;padding:30px}
body.ov-solo{background:transparent}
body.ov-solo header,body.ov-solo nav{display:none}
body.ov-solo main{max-width:none;padding:0}
.ov-title{font-weight:900;letter-spacing:.2em;color:var(--gold);font-size:14px;margin-bottom:8px;text-shadow:0 2px 6px #000}
.ov-item{--kc:#f5b942;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.72);border:1px solid color-mix(in srgb,var(--kc) 45%,transparent);border-left:5px solid var(--kc);border-radius:10px;padding:8px 12px;margin-bottom:6px;font-weight:800;font-size:16px}
.ov-kind{color:var(--kc);font-size:.62em;letter-spacing:.14em;text-transform:uppercase;font-weight:900;display:block}
.ov-who{color:#e8e0cc;font-weight:600;font-size:.78em}
.ovcolors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.ovcolors label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700}
.ovcolors input[type=color]{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:#101013;padding:3px;cursor:pointer}
.fxbtns{display:flex;gap:8px;flex-wrap:wrap}
.ov-item.first{border-color:var(--kc);box-shadow:0 0 18px color-mix(in srgb,var(--kc) 35%,transparent);font-size:19px}
.ov-n{color:var(--gold);min-width:20px}
.ov-song{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-artist{color:var(--muted);font-weight:600}
.ov-tip{background:var(--green);color:#000;border-radius:99px;padding:2px 10px;font-size:13px}
.ov-more,.ov-empty{color:var(--muted);font-weight:700;text-shadow:0 2px 6px #000}
.ov-goal{position:absolute;left:16px;right:16px;bottom:14px;background:rgba(0,0,0,.78);border:1px solid rgba(245,185,66,.55);border-radius:12px;padding:8px 12px 10px;font-weight:900;text-shadow:0 2px 6px #000;transition:box-shadow .4s}
.ov-goal[hidden]{display:none}
.ov-stage:has(.ov-goal:not([hidden])){padding-bottom:84px}.ov-stage.solo:has(.ov-goal:not([hidden])){padding-bottom:150px}
.ov-goal .gl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;letter-spacing:.14em;font-size:13px;color:var(--gold)}
.ov-goal .gl b{color:#fff;letter-spacing:.02em;font-size:16px}
.ov-goal .gt{height:12px;margin-top:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.ov-goal .gf{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#b8801f,#f5b942 55%,#ffe7a3);box-shadow:0 0 14px rgba(245,185,66,.7);transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.ov-goal.hit{border-color:#ffe7a3;box-shadow:0 0 28px rgba(245,185,66,.85)}
.ov-goal.hit .gl span{color:#ffe7a3}
.ov-stage.solo .ov-goal{left:30px;right:30px;bottom:30px;padding:14px 20px 16px}.ov-stage.solo .ov-goal .gl{font-size:22px}.ov-stage.solo .ov-goal .gl b{font-size:30px}.ov-stage.solo .ov-goal .gt{height:20px;margin-top:10px}
.goalrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.goalrow input[type=number]{width:120px}
.ov-stage.solo .ov-item{font-size:28px}.ov-stage.solo .ov-item.first{font-size:34px}.ov-stage.solo .ov-title{font-size:22px}
@media (max-width:720px){.ovgrid{grid-template-columns:minmax(0,1fr)}.toolbar{position:static}.toolbar #tbSong{max-width:100%;width:100%}.sw{width:30px;height:30px}.tbb{padding:8px 11px}.slrow{flex-wrap:wrap}.slrow .c{width:100%}}
.chip{display:inline-block;background:#222;border:1px solid #444;border-radius:99px;padding:4px 10px;font-size:12px;margin:2px 4px 2px 0}
.setlist-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.setlist-row:hover{border-color:var(--gold)}
.setlist-row .n{font-weight:800}
.setlist-row .c{color:var(--muted);font-size:13px;margin-left:auto}
.toast{pointer-events:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gold);color:#000;font-weight:800;padding:10px 20px;border-radius:14px;display:none;z-index:50;max-width:min(92vw,560px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.6)}
.toast.err{background:var(--red);color:#fff}
button:active{transform:scale(.97)}
.song .min,.mintip{background:#1d1500;border:1px solid var(--gold-dim);color:var(--gold);border-radius:99px;padding:5px 10px;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap}
.mintip{font-size:14px;padding:6px 12px;margin-left:6px}
.song .min:hover,.mintip:hover{background:var(--gold);color:#000}
.notice{background:#1a1300;border:1px solid var(--gold-dim);border-radius:12px;padding:12px 14px;margin:0 0 12px;color:var(--text);font-size:14px;line-height:1.5}
.ovurl{font-family:ui-monospace,Menlo,monospace;background:#0d0d0d;border:1px solid var(--line);border-radius:8px;padding:10px;word-break:break-all;user-select:all}
.small{color:var(--muted);font-size:13px}
.syncrow{display:flex;justify-content:flex-end;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin-bottom:2px}
.btn.sync{background:var(--green);color:#000;padding:8px 16px;font-size:13px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
@media (max-width:640px){h1{font-size:32px}.logo{font-size:18px}.viewas{margin-left:0;width:100%}}
</style>

<script>
const $ = (s) => document.querySelector(s);
const main = $('#main');
const toastEl = $('#toast');
let songs = [];
let setlists = [];
let queue = [];
let notes = '';
let view = 'board';
let filterTag = 'Favorites';
let searchQ = '';
let performerMode = true;
let currentSong = null;
let currentSetlist = null;
let makerSetlist = null;
let makerAdding = false;
let overlayTimer = null;
let prevView = 'board';
let lastSync = null;

const TAGS = ['Favorites','All','60s','70s','80s','90s','2000s','2010s','2020s','Country','Medleys','Bangers','Most requested','Elton John','Billy Joel'];
const SHOW_MOST_REQUESTED = false; // flip to true the night after the first show (also lib/request-log.js)
let analyticsSort = 'requests';
let analyticsCache = null;
// ---- Embed-aware viewport helpers ----
// Inside the Wix page the app runs in a tall iframe (1200-1700 px) inside a
// shorter browser window. Anything positioned against the iframe's own
// viewport (bottom toasts, content rendered below the fold, scrollTo(0,0))
// lands outside what the visitor can actually see, which made every button
// look dead. We track the visible slice of the iframe with an
// IntersectionObserver and use it for toasts and for bringing new content
// into view.
const EMBEDDED = (function(){ try{ return window.self !== window.top; }catch(e){ return true; } })();
let visTop = 0, visBottom = window.innerHeight;
(function trackVisible(){

function visibleSongs(){
  let list = songs.filter(s => s.visible);
  if(filterTag === 'Favorites') list = list.filter(s => s.favorite);
  else if(filterTag === 'Elton John') list = list.filter(s => (s.artist||'').toLowerCase().includes('elton john'));
  else if(filterTag === 'Billy Joel') list = list.filter(s => (s.artist||'').toLowerCase().includes('billy joel'));
  else if(filterTag === 'Most requested') list = list.filter(s => (s.requestCount||0) > 0).sort((a,b) => (b.requestCount||0) - (a.requestCount||0));

    const q = searchQ.toLowerCase();
    list = list.filter(s => s.title.toLowerCase().includes(q) || (s.artist||'').toLowerCase().includes(q));

}

  const kb = mac ? 'press the <b>Fn</b> (or Globe) key twice' : 'tap the <b>&#127908; mic on your keyboard</b>';

      for(const c of ci){ html += esc(L.slice(prev, c.col)) + `<span class="ch" style="color: ${c.color}">${esc(c.name)}</span>`; prev = c.col + c.name.length; }
      outLines.push(`<div>${html + esc(L.slice(prev)) || '<br>'}</div>`); continue;
    }
    const d = a.cloneNode(true);
    d.querySelectorAll('.ch').forEach(x => { if(!x.style.color) x.style.color = chordColor(x.textContent); });
    let inner = sanitizeNoteHtml(d.innerHTML);
    if(!inner.replace(/<br>|&nbsp;|\s/g,'')) inner = '<br>';
    const sec = a.classList.contains('sec') || /^\s*\[[^\]]+\]\s*$/.test(txt(a));
    outLines.push(`<div${sec ? ' style="color: #21cbff"' : ''}>${inner}</div>`);
  }
  return outLines.join('');
}

// Shared paste: HTML (Apple Notes, web) is sanitized and keeps colours; plain text is inserted
// as typed, except an old chord-over-lyric chart, which is turned into inline coloured chords.
function looksLikeChordChart(text){
  const lines = String(text).split('\n'); let n = 0;
  for(const l of lines){ const t = l.trim().split(/\s+/).filter(Boolean); if(t.length && t.every(x => CHORD_RE.test(x) || /^[|x\d()-]+$/.test(x)) && t.some(x => CHORD_RE.test(x))) n++; }
  return n >= 2;
}
function notePasteInsert(cd){
  const html = cd.getData('text/html'), text = cd.getData('text/plain');
  if(html){ const clean = sanitizeNoteHtml(html); document.execCommand('insertHTML', false, clean || esc(text)); }
  else if(text && looksLikeChordChart(text)) document.execCommand('insertHTML', false, noteFromChart(text));
  else if(text) document.execCommand('insertText', false, text);
}

function wireNoteEditor(box, bar){

// ---- tag picker: tap preset chips (multi-select, tap again to clear) ----
// Saved tags use the same spelling as the Song Board filter chips, so filters always match.
const PRESET_TAGS = ['50s','60s','70s','80s','90s','2000s','2010s','2020s','Country','Medleys','Bangers'];
function canonTag(t){
  t = String(t||'').trim(); if(!t) return '';
  const k = t.toLowerCase().replace(/[’']/g,'').replace(/\s+/g,'');
  const m = k.match(/^(?:19)?([5-9]0)s?$/); if(m) return m[1] + 's';        // 80, 80's, 1980s -> 80s
  const y = k.match(/^(20[0-2]0)s?$/); if(y) return y[1] + 's';              // 2000, 2000's -> 2000s
  const p = PRESET_TAGS.find(x => x.toLowerCase() === k); if(p) return p;
  return t;
}
function tagPickerHTML(id, tags){
  const sel = []; (tags||[]).forEach(t => { const c = canonTag(t); if(c && !sel.includes(c)) sel.push(c); });
  const all = PRESET_TAGS.concat(sel.filter(t => !PRESET_TAGS.includes(t)));
  return `<div class="tagpick" id="${id}">${all.map(t => `<button type="button" class="tagchip${sel.includes(t)?' on':''}" data-tagv="${esc(t)}" aria-pressed="${sel.includes(t)}">${esc(t)}</button>`).join('')}

}
function wireTagPicker(root){
  const flip = b => { const on = !b.classList.contains('on'); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); };
  root.addEventListener('click', e => {

const SWATCHES = [['#ffffff','white'],['#feff0a','yellow'],['#fb0007','red'],['#21cbff','cyan'],['#2bff2b','green'],['#b5d900','olive'],['#ff8a00','orange'],['#fb00ff','magenta']];
let chartLocked = true, chartDirty = false, autoTimer = null, autoSpeed = 3, savedRange = null;
function applyChartType(box, size, spacing){

function setChartLocked(locked){

function cleanChartHtml(box){

async function saveChart(song, extra){

// ---- auto-scroll: a gentle, steady glide inside the chart box ----
// Speed 1..10 maps to 1.5..60 px per second on an exponential curve (default 3 = ~3.4 px/s,
// about one lyric line every 7 seconds). Start: one smooth page scroll brings the toolbar
// to the top of what you can see, the box is sized to the rest, then the speed eases in
// over ~1.2 s and moves with sub-pixel steps. SPACE BAR starts and stops it — it is the
// only way to stop it besides the Start/Stop button and reaching the end. Wheeling,
// touching, dragging or clicking the chart does NOT stop it; if you move the chart
// yourself the scroll just carries on from where you left it. Stops at the end.
const AUTO_MIN = 1.5, AUTO_MAX = 60;
function autoPxPerSec(s){ return AUTO_MIN * Math.pow(AUTO_MAX / AUTO_MIN, (Number(s) - 1) / 9); }
try{ const v = Number(localStorage.getItem('kkAutoSpeed')); if(v >= 1 && v <= 10) autoSpeed = v; }catch(e){}
let autoPrep = null;
function stopAutoScroll(msg){
  if(autoTimer){ cancelAnimationFrame(autoTimer); autoTimer = null; }
  if(autoPrep){ clearTimeout(autoPrep); autoPrep = null; }
  const b = document.getElementById('tbScroll'); if(b) b.innerHTML = '&#9654; Start';
  if(msg) toast(msg);
}
function startAutoScroll(){
  const box = $('#chartBox'); if(!box) return;
  const tb = $('#toolbar');
  $('#tbScroll').innerHTML = '&#9208; Stop';
  // 1) size the box to the visible area below the toolbar (only if it is taller than that)
  const visH = Math.max(240, (visBottom - visTop) - (tb ? tb.offsetHeight : 0) - 24);
  if(box.scrollHeight > visH + 4){ box.style.maxHeight = visH + 'px'; box.style.overflowY = 'auto'; }
  // 2) one smooth page scroll so the toolbar sits at the top of the visible area
  const anchor = tb || box;
  const r = anchor.getBoundingClientRect();
  const want = Math.max(0, window.scrollY + r.top - visTop - 8);
  const dist = Math.abs(want - window.scrollY);
  if(dist > 6){
    const need = want + window.innerHeight - document.documentElement.scrollHeight;
    if(need > 0) main.style.paddingBottom = (80 + need) + 'px';
    try{ window.scrollTo({top: want, behavior: 'smooth'}); }catch(e){ window.scrollTo(0, want); }
  }
  const delay = dist > 6 ? Math.min(700, 250 + dist * 0.6) : 0;
  autoPrep = setTimeout(() => {
    autoPrep = null;
    let pos = box.scrollTop, last = performance.now(), t0 = last;
    const RAMP = 1200; // ms ease-in
    const step = now => {
      const dt = Math.min(0.1, (now - last) / 1000); last = now;
      const k = Math.min(1, (now - t0) / RAMP), ease = k * k * (3 - 2 * k); // smoothstep
      // if something else moved the box (user drag), follow it instead of snapping back
      if(Math.abs(box.scrollTop - pos) > 2) pos = box.scrollTop;
      pos += autoPxPerSec(autoSpeed) * ease * dt;
      box.scrollTop = pos;
      if(box.scrollTop + box.clientHeight >= box.scrollHeight - 1){ stopAutoScroll('End of chart'); return; }
      autoTimer = requestAnimationFrame(step);
    };
    autoTimer = requestAnimationFrame(step);
  }, delay);
}
// Space bar toggles auto-scroll: press once to start, press again to stop. It is the
// ONLY keyboard way to stop it — wheeling, touching, dragging or clicking the chart
// never stops it. Space is ignored while the user is typing (input / textarea / select
// / contenteditable chart) or when a button has focus (space already clicks it).
document.addEventListener('keydown', e => {
  if(e.code !== 'Space' && e.key !== ' ') return;
  const t = e.target;
  if(!t) return;
  const tag = (t.tagName || '').toUpperCase();
  if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON' || t.isContentEditable) return;
  if(!document.getElementById('chartBox')) return;
  e.preventDefault();
  if(autoTimer || autoPrep) stopAutoScroll(); else startAutoScroll();
});
function inChart(range){ const box = $('#chartBox'); return range && box && box.contains(range.commonAncestorContainer); }

      saveChart(song).then(() => { if(chartLocked) toast('Chart size saved'); }).catch(e => toast('Save failed: ' + e.message, true));
    }, 700);
  };
  const typeChanged = () => applySize(Number($('#tbSize').value), true);
  $('#tbSize').addEventListener('input', typeChanged);
  $('#tbSpacing').addEventListener('input', typeChanged);
  $('#tbSpeed').addEventListener('input', e => { autoSpeed = Number(e.target.value); $('#tbSpeedV').textContent = autoSpeed; try{ localStorage.setItem('kkAutoSpeed', autoSpeed); }catch(_){} });
  $('#tbScroll').addEventListener('click', () => { if(autoTimer || autoPrep) stopAutoScroll(); else startAutoScroll(); });

  // Two-finger pinch (iPhone/iPad + Safari gesture events) and Mac trackpad
  // pinch (ctrl+wheel, and Safari gesture*) scale the chart Size, clamped to
  // the slider. preventDefault only for a pinch so the page does not zoom
  // and one-finger / wheel scrolling still work. Works locked or editing.
  const touchDist = ev => {
    if(!ev.touches || ev.touches.length < 2) return 0;
    const a = ev.touches[0], b = ev.touches[1];
    return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  };
  const chartPx = () => parseFloat(box.style.fontSize) || Number($('#tbSize').value) || 19;
  let pinchMode = null, pinchStart = 19, pinchStartDist = 0;
  const endPinch = () => { if(pinchMode){ pinchMode = null; applySize(chartPx(), true); } };
  box.addEventListener('gesturestart', e => {
    e.preventDefault();
    pinchMode = 'gesture'; pinchStart = chartPx();
  }, {passive:false});
  box.addEventListener('gesturechange', e => {
    if(pinchMode !== 'gesture') return;
    e.preventDefault();
    applySize(pinchStart * (e.scale || 1), false);
  }, {passive:false});
  box.addEventListener('gestureend', e => { e.preventDefault(); endPinch(); }, {passive:false});
  box.addEventListener('touchstart', e => {
    if(e.touches.length >= 2 && pinchMode !== 'gesture'){
      pinchMode = 'touch'; pinchStart = chartPx(); pinchStartDist = touchDist(e) || 1;
    }
  }, {passive:true});
  box.addEventListener('touchmove', e => {
    if(pinchMode === 'touch' && e.touches.length >= 2){
      e.preventDefault();
      applySize(pinchStart * (touchDist(e) / pinchStartDist), false);
    }
  }, {passive:false});
  box.addEventListener('touchend', e => { if(pinchMode === 'touch' && e.touches.length < 2) endPinch(); }, {passive:true});
  box.addEventListener('touchcancel', e => { if(pinchMode === 'touch') endPinch(); }, {passive:true});
  box.addEventListener('wheel', e => {
    if(!(e.ctrlKey || e.metaKey) || pinchMode) return;
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 120 : 1;
    applySize(chartPx() * Math.exp(-(e.deltaY * unit) * 0.0035), false);
  }, {passive:false});
}

function renderImport(){
  main.innerHTML = `
  <h1 style="font-size:32px">SMART IMPORT</h1>
  <p class="lede">One song per line: <b>Title - Artist</b> (or <b>Title | Artist</b>). Songs already on the board are skipped.</p>
  <div class="panel">
    <label>Paste songs</label>
    <textarea id="impText" rows="14" placeholder="500 Miles - The Proclaimers&#10;9 To 5 - Dolly Parton"></textarea>
    <div class="btnrow"><button class="btn" id="impGo">Import</button></div>
    <div id="impResult" style="margin-top:14px"></div>
  </div>`;
  $('#impGo').addEventListener('click', async () => {
    const lines = $('#impText').value.split('\n');
    const seen = new Set(songs.map(s => (s.title+'\u0000'+(s.artist||'')).toLowerCase()));
    let added = 0, skipped = 0;
    for(const raw of lines){
      const line = raw.trim();
      if(!line) continue;
      let title = line, artist = '';
      const pipe = line.indexOf('|');
      if(pipe >= 0){ title = line.slice(0, pipe).trim(); artist = line.slice(pipe+1).trim(); }
      else {
        const m = line.match(/^(.+?)\s+-\s+(.+)$/);
        if(m){ title = m[1].trim(); artist = m[2].trim(); }
      }
      if(!title){ skipped++; continue; }
      const key = (title+'\u0000'+artist).toLowerCase();
      if(seen.has(key)){ skipped++; continue; }
      try{
        await api('/api/songs', {method:'POST', body: JSON.stringify({title, artist, tags: [], minTipCents: 0})});
        seen.add(key); added++;
      }catch(e){ skipped++; }
    }
    await loadSongs();
    $('#impResult').innerHTML = '<p><b>Added '+added+' songs, skipped '+skipped+' already on the board</b></p>';
  });
}

const OVERLAY_URL = 'https://killer-keys-tip-app.onrender.com/?view=overlay';
let overlaySeenExplode = null, overlaySeenIds = null, overlaySeq = 0, overlayGoalSeen = null;
const cad = c => { const d = (Number(c)||0) / 100; return '$' + (d % 1 ? d.toFixed(2) : d.toLocaleString('en-CA')); };
function fillGoal(stage, g){
  const box = $('#ovGoal'); if(!box || !g) return;
  box.hidden = !g.show;
  const goal = Math.max(1, g.goalCents), now = Math.max(0, g.tallyCents), pct = Math.min(100, now / goal * 100);
  $('#ovGoalTxt').textContent = cad(now) + ' / ' + cad(goal);
  const t = $('#ovTally'); if(t) t.textContent = cad(now);
  $('#ovGoalFill').style.width = pct + '%';
  box.classList.toggle('hit', now >= goal);
  const key = goal + ':' + g.resetAt;
  // celebrate once, only when the tally crosses the goal while this overlay is open
  if(overlayGoalSeen && overlayGoalSeen.key === key && overlayGoalSeen.now < goal && now >= goal && g.show)
    setTimeout(() => celebrateGoal(stage, goal), 900);
  overlayGoalSeen = { key, now };
}
function celebrateGoal(stage, goal){
  if(stage && window.KKOverlayFX) KKOverlayFX.celebrate(stage, { kicker:'★ Tip goal hit ★', title:'Thank you!', badge: cad(goal) + ' reached', tier:'small', color:'#f5b942' });
}
let overlayColors = { song:'#f5b942', custom:'#39c2d7', shoutout:'#ff6fa5' };
const KIND_LABEL = { song:'Request', custom:'Custom request', shoutout:'Shout-out' };
function overlayMarkup(d){
  const q = d.queue || [];
  if(!q.length) return '<div class="ov-empty">No requests in the queue yet</div>';
  return `<div class="ov-title">&#127929; REQUESTS</div>` + q.map((it,i) => {
    const k = it.kind || 'song', c = overlayColors[k] || overlayColors.song;
    const main = k === 'shoutout' ? (it.message || 'Shout-out') : it.songTitle;
    return `<div class="ov-item${i===0?' first':''} k-${k}" style="--kc:${c}"><span class="ov-n">${i===0?'&#9654;':i+1}</span>
      <span class="ov-song">${k !== 'song' ? `<span class="ov-kind">${KIND_LABEL[k]}</span>` : ''}${esc(main)}${k==='song' && it.artist?`<span class="ov-artist"> — ${esc(it.artist)}</span>`:''}${it.requester?`<span class="ov-who"> · ${esc(it.requester)}</span>`:''}</span>
      ${it.tipCents?`<span class="ov-tip">$${(it.tipCents/100).toFixed(0)}</span>`:''}</div>`; }).join('') +
    (d.total > q.length ? `<div class="ov-more">+${d.total - q.length} more</div>` : '');
}
function celebrateItem(stage, it, test){
  if(!stage || !window.KKOverlayFX) return;
  const k = it.kind || 'song';
  KKOverlayFX.celebrate(stage, { title: k === 'shoutout' ? 'Shout-out' : k === 'custom' ? String(it.songTitle||'').replace(/^Custom:\s*/,'') : it.songTitle || it.title,
    artist: k === 'song' ? it.artist : '', requester: it.requester, tipCents: it.tipCents, kind: k, test: !!test, color: overlayColors[k] || overlayColors.song });
}
async function fillOverlay(){
  const body = $('#ovBody'); if(!body) return;
  const seq = ++overlaySeq;
  try{
    const d = await api('/api/overlay');
    if(seq !== overlaySeq) return; // a newer refresh already started; drop this stale answer
    if(d.colors) overlayColors = Object.assign(overlayColors, d.colors);
    body.innerHTML = overlayMarkup(d);
    const stage = $('#ovStage');
    fillGoal(stage, d.goal);
    if(overlaySeenExplode !== null && d.explodeAt > overlaySeenExplode && d.test) celebrateItem(stage, Object.assign({ songTitle: d.test.title }, d.test), true);
    const recent = d.recent || [];
    if(overlaySeenIds) recent.filter(x => !overlaySeenIds.has(x.id)).reverse().forEach(x => celebrateItem(stage, x));
    overlaySeenExplode = d.explodeAt; overlaySeenIds = new Set(recent.map(x => x.id).concat(overlaySeenIds ? [...overlaySeenIds].slice(0, 200) : []));
  }catch(e){ body.innerHTML = '<div class="ov-empty">Could not load the queue (' + esc(e.message) + ')</div>'; }
}

function paintAnalytics(){
  const d = analyticsCache || { totals:{requests:0,tipCents:0,nights:0,songs:0}, kinds:{}, nights:[], songs:[] };

    };
    $('#'+saveId).addEventListener('click', saveCustom);
    $('#'+amtId).addEventListener('keydown', e => { if(e.key === 'Enter') saveCustom(); });
  };
  wirePanel('song','tipCustomAmt','tipCustomSave','tipCustomRow','tipSongOpts');
  wirePanel('custom','tipCustomReqAmt','tipCustomReqSave','tipCustomReqRow','tipCustomOpts');
  wirePanel('shout','tipShoutAmt','tipShoutSave','tipShoutRow','tipShoutOpts');
  $('#socSave').addEventListener('click', async () => {
    try{ await api('/api/settings', {method:'PUT', body: JSON.stringify({socialYoutube: $('#socYt').value.trim(), socialInstagram: $('#socIg').value.trim()})}); toast('Fan page links saved'); pingFan(); }
    catch(e){ toast('Links not saved: ' + e.message, true); }
  });
  main.querySelectorAll('[data-opensong]').forEach(el => el.addEventListener('click', () => openSong(Number(el.dataset.opensong))));
}

/* ---------- View as Fan: the live phone page in a phone-sized frame ---------- */
function setPriceBadge(c){ const b = document.getElementById('priceBadge'); if(b) b.innerHTML = 'REQUEST BOARD &middot; ' + (c > 0 ? '$' + (c % 100 ? (c/100).toFixed(2) : c/100) + ' MIN' : 'FREE'); }
function pingFan(){ const f = document.getElementById('fanFrame'); if(f && f.contentWindow) f.contentWindow.postMessage({kk:'refreshFan'}, '*'); }
function renderFanPreview(){
  main.innerHTML = `
  <div class="fanstage">
    <div class="fanbar">
      <button class="btn" id="fanClose">&#10005; Close fan view</button>
      <button class="btn ghost" id="fanReload">Reload</button>
      <a class="btn ghost" href="/fan" target="_blank" rel="noopener">Open in new tab</a>
    </div>
    <p class="small" style="margin:0;text-align:center">Live — this is the real fan page at iPhone size. Changes to songs, setlists or Tips show up here within a couple of seconds.</p>
    <div class="phonebox" id="phoneBox"><div class="phone" id="phone"><div class="notch"></div><iframe id="fanFrame" title="Fan view" src="/fan?preview=1"></iframe></div></div>
  </div>`;
  const fit = () => {
    const box = $('#phoneBox'), ph = $('#phone'); if(!box || !ph) return;
    const avail = Math.min(main.clientWidth || 390, window.innerWidth - 16);
    const k = Math.min(1, avail / 414);
    ph.style.transform = 'scale(' + k + ')';
    box.style.width = (414 * k) + 'px'; box.style.height = (868 * k) + 'px';
  };
  fit(); window.addEventListener('resize', fit);
  $('#fanClose').addEventListener('click', closeFanPreview);
  $('#fanReload').addEventListener('click', () => { $('#fanFrame').src = '/fan?preview=1&t=' + Date.now(); });
}
function closeFanPreview(){ setView(['board','qr','add','import','queue','maker','setlists','mod','overlay','notes','tips','analytics'].includes(prevView) ? prevView : 'board'); }
window.addEventListener('message', e => { if(e.data && e.data.kk === 'closeFan' && view === 'fan') closeFanPreview(); });

function setView(v){
  stopAutoScroll();
  if(v === 'fan' && view !== 'fan') prevView = view;
  view = v; currentSetlist = null; makerSetlist = null; makerAdding = false;
  if(overlayTimer){ clearInterval(overlayTimer); overlayTimer = null; }
  const nav = document.getElementById('topnav');
  const solo = v==='overlay' && !EMBEDDED && new URLSearchParams(location.search).get('view') === 'overlay';
  if(nav) nav.style.display = solo ? 'none' : '';
  document.querySelectorAll('#topnav button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  if(v==='board') renderBoard();
  else if(v==='qr') renderQR();
  else if(v==='add') renderAdd();
  else if(v==='import') renderImport();
  else if(v==='queue') renderQueue();
  else if(v==='maker') renderMaker();
  else if(v==='setlists') renderSetlists();
  else if(v==='mod') renderMod();
  else if(v==='overlay') renderOverlay();
  else if(v==='notes') renderNotes();
  else if(v==='tips') renderTips();
  else if(v==='analytics') renderAnalytics();
  else if(v==='fan') renderFanPreview();
  freshView();
}

document.querySelectorAll('#topnav button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));


(async function init(){
  api('/api/settings').then(d => setPriceBadge(Number((d.settings||{}).globalMinCents) || 0)).catch(() => {});
  await loadSongs();
  lastSync = new Date();
  const v = new URLSearchParams(location.search).get('view');
  if (v && ['board','qr','add','import','queue','maker','setlists','mod','overlay','notes','tips','analytics','fan'].includes(v)) setView(v);
  else renderBoard();
})();
</script>
