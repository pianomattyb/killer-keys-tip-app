<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Killer Keys — Tip &amp; Request App</title>
<style>
:root{--gold:#f5b942;--gold-dim:#c98f2b;--bg:#000;--panel:#111;--panel2:#1a1a1a;--line:#2a2a2a;--text:#f2ede6;--muted:#a8a29a;--green:#22c55e;--red:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--gold)}
header{padding:14px 20px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.04em;font-size:22px;white-space:nowrap}
.logo b{color:var(--gold)}
.sub{color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.viewas{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;letter-spacing:.1em}
.viewas button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:99px;padding:7px 16px;font-weight:700;cursor:pointer}
.viewas button.on{background:var(--green);border-color:var(--green);color:#000}
body.fan .perf{display:none!important}
.badge{background:var(--gold);color:#000;font-weight:800;font-size:11px;padding:3px 10px;border-radius:99px;letter-spacing:.06em}
nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line)}
nav button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:99px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:14px}
nav button.on{background:#fff;color:#000;border-color:#fff}
nav button.gold{background:var(--gold);color:#000;border-color:var(--gold)}
nav button:hover{border-color:var(--gold)}
main{max-width:1000px;margin:0 auto;padding:18px 20px 80px}
h1{font-size:44px;line-height:1.05;margin:8px 0 10px;font-weight:900;letter-spacing:.01em}
h1 span{color:var(--gold)}
.lede{color:var(--muted);font-size:15px;line-height:1.55;max-width:720px}
.lede b{color:var(--text)}
.search{display:flex;gap:8px;margin:18px 0 12px}
.search input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:13px 16px;font-size:16px}
.search input:focus{outline:2px solid var(--gold)}
.search button{background:var(--panel);border:1px solid var(--gold);color:var(--gold);border-radius:12px;padding:0 16px;font-weight:700;cursor:pointer}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:99px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px}
.filters button.on{background:var(--gold);color:#000;border-color:var(--gold)}
.song{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.song:hover{border-color:var(--gold)}
.song .tt{font-weight:800;font-size:17px}
.song .aa{color:var(--muted);font-size:13px;margin-top:2px}
.song .tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:#2b2b2b;border:1px solid #3a3a3a;border-radius:6px;padding:2px 7px;color:#ffd479}
.tag.banger{background:#3a2a00;border-color:#6b4d00}
.tag.country{background:#1d2b1d;border-color:#2f5a2f}
.song .star{color:var(--gold);font-size:18px}
.song .chev{margin-left:auto;color:var(--gold);font-size:22px;font-weight:800}
.song .min{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h2{margin:0 0 12px;font-size:22px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=number],textarea,select{width:100%;background:#0d0d0d;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:11px 12px;font-size:15px}
textarea{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace}
.btn{background:var(--gold);color:#000;border:0;border-radius:99px;padding:11px 22px;font-weight:800;cursor:pointer;font-size:15px}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--red);color:#fff}
.btnrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.chartbox{background:#0b0b0b;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:16px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,"Courier New",monospace;line-height:1.45}
.chartbox div,.chartbox p,.chartbox pre{white-space:pre;margin:0;background:transparent}
.chartbox .ch{color:var(--gold);font-weight:800}
.chartbox .sec{color:#21cbff;font-weight:800}
.chartbox .song-head{font-size:1.25em;font-weight:900;color:var(--text)}
.chartbox .song-sub{color:var(--muted)}
.chartbox.plain{white-space:pre}
.chartbox:empty::before{content:attr(data-empty);color:var(--muted);font-family:inherit}
.chartbox.editing{outline:2px dashed var(--gold);outline-offset:3px;cursor:text}
.chartbox .wrapcont{padding-left:1ch}
.chartbox .softwrap,.chartbox .softwrap *{white-space:pre-wrap!important;overflow-wrap:anywhere;tab-size:2}
@media (max-width:640px){.chartbox.editing div,.chartbox.editing p{white-space:pre-wrap}}
.charthead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.lockstat{font-size:13px;font-weight:800;color:var(--green);margin-left:auto}
.lockstat.dirty{color:var(--gold)}
.small-btn{padding:7px 14px;font-size:13px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;position:sticky;top:0;z-index:5}
.toolbar select{width:auto;max-width:260px;padding:8px 10px;font-size:14px}
.toolbar .tbl{display:flex;align-items:center;gap:6px;margin:0;font-size:12px;color:var(--muted);font-weight:700}
.toolbar input[type=range]{width:90px;accent-color:var(--gold)}
.toolbar .tbl span{min-width:18px;color:var(--text)}
.tbb{background:#0d0d0d;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-weight:700;cursor:pointer;font-size:13px}
.tbb:hover{border-color:var(--gold)}
.swatches{display:flex;gap:5px}
.sw{width:24px;height:24px;border-radius:6px;border:2px solid #333;cursor:pointer;padding:0}
.toolbar.locked .edit-only{opacity:.35}
.slcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.slhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.viewers{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tog{min-width:52px;border:1px solid var(--line);background:#2a2a2a;color:var(--muted);border-radius:99px;padding:6px 10px;font-weight:900;font-size:12px;cursor:pointer}
.tog.on{background:var(--green);border-color:var(--green);color:#000}
.btn.sm{padding:7px 14px;font-size:13px}
.iconbtn{background:none;border:0;font-size:20px;cursor:pointer;padding:2px 4px}
.iconbtn.dim{opacity:.25;cursor:default}
.slrow .c{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.slrow.is-off .n,.slrow.is-off .small{opacity:.4;text-decoration:line-through}
.ovgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
.ovgrid>*{min-width:0}
#ovVisible{accent-color:var(--gold)}
.ov-stage{position:relative;aspect-ratio:16/9;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:repeating-conic-gradient(#151515 0 25%,#1d1d1d 0 50%) 0 0/24px 24px;padding:16px}
.ov-stage.solo{aspect-ratio:auto;height:100vh;border:0;border-radius:0;background:transparent;padding:30px}
body.ov-solo{background:transparent}
body.ov-solo header,body.ov-solo nav{display:none}
body.ov-solo main{max-width:none;padding:0}
.ov-title{font-weight:900;letter-spacing:.2em;color:var(--gold);font-size:14px;margin-bottom:8px;text-shadow:0 2px 6px #000}
.ov-item{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.72);border:1px solid rgba(245,185,66,.4);border-radius:10px;padding:8px 12px;margin-bottom:6px;font-weight:800;font-size:16px}
.ov-item.first{border-color:var(--gold);font-size:19px}
.ov-n{color:var(--gold);min-width:20px}
.ov-song{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-artist{color:var(--muted);font-weight:600}
.ov-tip{background:var(--green);color:#000;border-radius:99px;padding:2px 10px;font-size:13px}
.ov-more,.ov-empty{color:var(--muted);font-weight:700;text-shadow:0 2px 6px #000}
.ov-stage.solo .ov-item{font-size:28px}.ov-stage.solo .ov-item.first{font-size:34px}.ov-stage.solo .ov-title{font-size:22px}
.boom{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center}
.boom-core{font-size:120px;animation:boomcore 1s ease-out forwards}
.boom .p{position:absolute;left:50%;top:50%;font-size:28px;animation:boomp 1.4s ease-out forwards}
@keyframes boomcore{0%{transform:scale(.2);opacity:1}60%{transform:scale(1.6);opacity:1}100%{transform:scale(2.2);opacity:0}}
@keyframes boomp{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.2);opacity:0}}
@media (max-width:720px){.ovgrid{grid-template-columns:minmax(0,1fr)}.toolbar{position:static}.toolbar select{max-width:100%;width:100%}.slrow{flex-wrap:wrap}.slrow .c{width:100%}}
.chip{display:inline-block;background:#222;border:1px solid #444;border-radius:99px;padding:4px 10px;font-size:12px;margin:2px 4px 2px 0}
.setlist-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.setlist-row:hover{border-color:var(--gold)}
.setlist-row .n{font-weight:800}
.setlist-row .c{color:var(--muted);font-size:13px;margin-left:auto}
.toast{pointer-events:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gold);color:#000;font-weight:800;padding:10px 20px;border-radius:14px;display:none;z-index:50;max-width:min(92vw,560px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.6)}
.toast.err{background:var(--red);color:#fff}
button:active{transform:scale(.97)}
.song .min,.mintip{background:#1d1500;border:1px solid var(--gold-dim);color:var(--gold);border-radius:99px;padding:5px 10px;font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap}
.mintip{font-size:14px;padding:6px 12px;margin-left:6px}
.song .min:hover,.mintip:hover{background:var(--gold);color:#000}
.notice{background:#1a1300;border:1px solid var(--gold-dim);border-radius:12px;padding:12px 14px;margin:0 0 12px;color:var(--text);font-size:14px;line-height:1.5}
.ovurl{font-family:ui-monospace,Menlo,monospace;background:#0d0d0d;border:1px solid var(--line);border-radius:8px;padding:10px;word-break:break-all;user-select:all}
.small{color:var(--muted);font-size:13px}
.syncrow{display:flex;justify-content:flex-end;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin-bottom:2px}
.btn.sync{background:var(--green);color:#000;padding:8px 16px;font-size:13px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
@media (max-width:640px){h1{font-size:32px}.logo{font-size:18px}.viewas{margin-left:0;width:100%}}
</style>

<body>
<header>
  <div class="logo">THE <b>KILLER KEYS</b></div>
  <div class="sub">Tip &amp; Request App</div>
  <div class="badge">REQUEST BOARD &middot; FREE</div>
  <div class="badge">PAYMENTS: LIVE &middot; STRIPE</div>
</header>
<nav id="topnav">
  <button data-view="board" class="on">Song Board</button>
  <button data-view="qr">QR code</button>
  <button data-view="add" class="gold">+ Add song</button>
  <button data-view="import" class="gold">+ Smart Import</button>
  <button data-view="queue">Performer Queue</button>
  <button data-view="maker">Setlist Maker</button>
  <button data-view="setlists">Setlists</button>
  <button data-view="mod">Off-Site Mod</button>
  <button data-view="overlay">Stream Overlay</button>
  <button data-view="notes">Performance Notes</button>
</nav>
<main id="main"><p class="lede" style="padding:30px 0">Loading the song board…</p></main>
<div class="toast" id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
const main = $('#main');
const toastEl = $('#toast');
let songs = [];
let setlists = [];
let queue = [];
let notes = '';
let view = 'board';
let filterTag = 'Favorites';
let searchQ = '';
let performerMode = true;
let currentSong = null;
let currentSetlist = null;
let makerSetlist = null;
let overlayTimer = null;
let lastSync = null;

const TAGS = ['Favorites','All','60s','70s','80s','90s','2000s','2010s','2020s','Country','Medleys','Bangers','Most requested','Elton John','Billy Joel'];
// ---- Embed-aware viewport helpers ----
// Inside the Wix page the app runs in a tall iframe (1200-1700 px) inside a
// shorter browser window. Anything positioned against the iframe's own
// viewport (bottom toasts, content rendered below the fold, scrollTo(0,0))
// lands outside what the visitor can actually see, which made every button
// look dead. We track the visible slice of the iframe with an
// IntersectionObserver and use it for toasts and for bringing new content
// into view.
const EMBEDDED = (function(){ try{ return window.self !== window.top; }catch(e){ return true; } })();
let visTop = 0, visBottom = window.innerHeight;
(function trackVisible(){
  if(!('IntersectionObserver' in window)) return;
  const probe = document.createElement('div');
  probe.setAttribute('aria-hidden','true');
  probe.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:100%;opacity:0;pointer-events:none;z-index:-1';
  document.body.appendChild(probe);
  const th = []; for(let i=0;i<=200;i++) th.push(i/200);
  new IntersectionObserver(entries => {
    const e = entries[entries.length-1];
    if(e.isIntersecting && e.intersectionRect.height > 0){ visTop = e.intersectionRect.top; visBottom = e.intersectionRect.bottom; }
    else { visTop = 0; visBottom = window.innerHeight; }
    placeToast();
  }, {threshold: th}).observe(probe);
})();
function placeToast(){
  if(toastEl.style.display !== 'block') return;
  const h = toastEl.offsetHeight || 44;
  toastEl.style.bottom = 'auto';
  toastEl.style.top = Math.max(visTop + 8, visBottom - h - 20) + 'px';
}
let toastTimer = null;
function toast(msg, isErr){
  toastEl.textContent = msg;
  toastEl.classList.toggle('err', !!isErr);
  toastEl.style.display = 'block';
  placeToast();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.style.display='none', isErr ? 4500 : 2600);
}
// Scroll so that el sits at the top of the part of the app the visitor can see.
function bringIntoView(el){
  if(!el) return;
  try{ el.scrollIntoView({block:'start'}); }catch(e){}
  requestAnimationFrame(() => {
    const r = el.getBoundingClientRect();
    if(r.top >= visTop - 2 && r.top <= visBottom - 60) return;
    const want = window.scrollY + r.top - visTop - 10;
    const need = want + window.innerHeight - document.documentElement.scrollHeight;
    if(need > 0) main.style.paddingBottom = (80 + need) + 'px';
    window.scrollTo(0, Math.max(0, want));
  });
}
function freshView(){ main.style.paddingBottom = ''; window.scrollTo(0,0); bringIntoView(document.querySelector('header')); }
window.addEventListener('unhandledrejection', e => { const m = (e.reason && e.reason.message) || String(e.reason || 'unknown error'); toast('That did not go through: ' + m, true); });
window.addEventListener('error', e => { if(e && e.message) toast('Something broke: ' + e.message, true); });
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
async function api(path, opts){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 15000);
  try{
    const r = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}, signal: ctrl.signal}, opts||{}));
    if(!r.ok){ const tx = await r.text(); throw new Error(tx || ('HTTP '+r.status)); }
    return r.json();
  }catch(e){
    if(e.name === 'AbortError') throw new Error('The app is waking up — tap again in a few seconds.');
    throw e;
  }finally{ clearTimeout(t); }
}

function visibleSongs(){
  let list = songs.filter(s => s.visible);
  if(filterTag === 'Favorites') list = list.filter(s => s.favorite);
  else if(filterTag === 'Elton John') list = list.filter(s => (s.artist||'').toLowerCase().includes('elton john'));
  else if(filterTag === 'Billy Joel') list = list.filter(s => (s.artist||'').toLowerCase().includes('billy joel'));
  else if(filterTag === 'Most requested') list = list.filter(s => (s.requestCount||0) > 0).sort((a,b) => (b.requestCount||0) - (a.requestCount||0));
  else if(filterTag !== 'All'){ const ft = filterTag.toLowerCase(); list = list.filter(s => (s.tags||[]).some(t => String(t).toLowerCase() === ft)); }
  if(searchQ){
    const q = searchQ.toLowerCase();
    list = list.filter(s => s.title.toLowerCase().includes(q) || (s.artist||'').toLowerCase().includes(q));
  }
  return list;
}

function renderBoard(){
  const list = visibleSongs();
  main.innerHTML = `
    <div class="syncrow"><span id="syncStamp">Last synced ${fmtSync(lastSync)}</span><button class="btn sync" id="syncBtn">Sync now</button></div>
    <h1>REQUEST A <span>$ONG</span></h1>
    <div class="search"><input id="q" type="text" placeholder="Search songs or artists..." value="${esc(searchQ)}"><button id="dictBtn" title="Dictation">&#127908; Dictate</button></div>
    <div id="dictMsg"></div>
    <div class="filters">${TAGS.map(t=>`<button data-tag="${t}" class="${filterTag===t?'on':''}">${t==='Favorites'?'&#9733; ':''}${t}</button>`).join('')}</div>
    <div id="list">${list.length ? list.map(songRow).join('') : (filterTag==='Most requested' && !searchQ ? '<div class="empty">No requests yet tonight — songs show up here once fans request them.</div>' : '<div class="empty">No songs match. Try another search or filter.</div>')}</div>`;
  $('#q').addEventListener('input', e => { searchQ = e.target.value; renderListOnly(); });
  $('#q').addEventListener('keydown', e => { if(e.key==='Enter') e.target.blur(); });
  document.querySelectorAll('.filters button').forEach(b => b.addEventListener('click', () => { filterTag = b.dataset.tag; renderBoard(); }));
  wireSongRows(document);
  const d = $('#dictBtn');
  if(d) d.addEventListener('click', startDictation);
  $('#syncBtn').addEventListener('click', syncNow);
}
function renderListOnly(){
  const list = visibleSongs();
  const el = $('#list'); if(!el) return;
  el.innerHTML = list.length ? list.map(songRow).join('') : '<div class="empty">No songs match. Try another search or filter.</div>';
  wireSongRows(el);
}
function wireSongRows(root){
  root.querySelectorAll('.song').forEach(n => n.addEventListener('click', () => openSong(Number(n.dataset.id))));
  root.querySelectorAll('.song [data-min]').forEach(b => b.addEventListener('click', ev => {
    ev.stopPropagation(); ev.preventDefault();
    openSong(Number(b.dataset.min), {editMin: true});
  }));
}

// ---- Dictation (Web Speech API) ----
let recog = null;
function dictMessage(html){ const m = $('#dictMsg'); if(m){ m.innerHTML = html ? '<div class="notice">'+html+'</div>' : ''; } }
function dictFallback(reason){
  const q = $('#q'); if(q) q.focus();
  const mac = /Mac/.test(navigator.platform) && !/iPhone|iPad/.test(navigator.userAgent);
  const kb = mac ? 'press the <b>Fn</b> (or Globe) key twice' : 'tap the <b>&#127908; mic on your keyboard</b>';
  dictMessage(reason + ' The search box is ready: ' + kb + ' to dictate into it.');
}
function startDictation(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let micAllowed = true;
  try{
    const pol = document.permissionsPolicy || document.featurePolicy;
    if(pol && pol.allowsFeature) micAllowed = pol.allowsFeature('microphone');
  }catch(e){}
  if(!SR){ dictFallback('Voice search is not supported in this browser.'); return; }
  if(!micAllowed){ dictFallback('The microphone is blocked inside this website frame.'); return; }
  if(recog){ try{ recog.stop(); }catch(e){} recog = null; dictMessage(''); return; }
  const r = new SR();
  recog = r;
  r.lang = 'en-US'; r.interimResults = true; r.maxAlternatives = 1;
  const btn = $('#dictBtn');
  if(btn) btn.innerHTML = '&#9209; Stop';
  dictMessage('Listening… say a song or artist.');
  r.onresult = ev => {
    let t = ''; for(const res of ev.results) t += res[0].transcript;
    searchQ = t.trim(); const q = $('#q'); if(q) q.value = searchQ; renderListOnly();
  };
  r.onerror = ev => {
    recog = null;
    if(ev.error === 'not-allowed' || ev.error === 'service-not-allowed') dictFallback('The microphone was blocked (by the browser or the website frame).');
    else if(ev.error === 'no-speech') dictMessage('Did not catch that — tap Dictate and try again.');
    else dictFallback('Voice search failed (' + esc(ev.error) + ').');
  };
  r.onend = () => { recog = null; const b = $('#dictBtn'); if(b) b.innerHTML = '&#127908; Dictate'; const m = $('#dictMsg'); if(m && /Listening/.test(m.textContent)) dictMessage(''); };
  try{ r.start(); }catch(e){ recog = null; dictFallback('Voice search could not start.'); }

// ---- catalogue matching (setlist titles vs catalogue titles differ in
// punctuation, curly quotes, parentheses, case and spacing) ----
function normTitle(t){
  return String(t||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
    .replace(/[\u2018\u2019\u201B`´]/g,"'").replace(/&/g,' and ')
    .replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
}
function bareTitle(t){ return normTitle(String(t||'').replace(/\([^)]*\)/g,' ').replace(/\[[^\]]*\]/g,' ')); }
function findCatalogSong(title, artist){
  const nt = normTitle(title), bt = bareTitle(title), na = normTitle(artist);
  const sameArtist = s => na && normTitle(s.artist) && (normTitle(s.artist).includes(na) || na.includes(normTitle(s.artist)));
  const pick = list => list.length ? (list.find(sameArtist) || list.find(s => s.visible) || list[0]) : null;
  const exact = songs.filter(s => s.title.toLowerCase() === String(title||'').toLowerCase());
  if(exact.length) return pick(exact);
  let hit = pick(songs.filter(s => normTitle(s.title) === nt)); if(hit) return hit;
  hit = pick(songs.filter(s => normTitle(s.title) === bt || bareTitle(s.title) === nt || bareTitle(s.title) === bt)); if(hit) return hit;
  // squashed compare ("rock n roll" vs "rock 'n' roll")
  const sq = x => x.replace(/ /g,'');
  hit = pick(songs.filter(s => sq(normTitle(s.title)) === sq(nt) || sq(bareTitle(s.title)) === sq(bt))); if(hit) return hit;
  if(na && bt.length >= 6) hit = songs.find(s => sameArtist(s) && (normTitle(s.title).includes(bt) || bt.includes(bareTitle(s.title)) && bareTitle(s.title).length >= 6));
  return hit || null;
}

// ---- chord chart on a dark background ----
// Charts were authored for a dark stage display: neon chord colours plus some
// spans forced to black (#000). On the dark box black text would vanish, so
// lift any too-dark inline colour toward white, keeping its hue.
function lum(r,g,b){ const f = c => { c/=255; return c <= .03928 ? c/12.92 : Math.pow((c+.055)/1.055, 2.4); }; return .2126*f(r)+.7152*f(g)+.0722*f(b); }
function darkenChart(box){
  box.querySelectorAll('[style*="color"],font[color]').forEach(el => {
    if(el.style && el.style.backgroundColor && !el.hasAttribute('data-kkbg')){ el.setAttribute('data-kkbg', el.style.backgroundColor); el.style.backgroundColor = 'transparent'; }
    const orig = el.style ? el.style.color : '';
    const m = getComputedStyle(el).color.match(/\d+(\.\d+)?/g); if(!m) return;
    let [r,g,b] = m.slice(0,3).map(Number);
    const max = Math.max(r,g,b), min = Math.min(r,g,b);
    if(max - min < 40 && lum(r,g,b) < .35){ if(!el.hasAttribute('data-kkc')) el.setAttribute('data-kkc', orig); el.style.color = 'var(--text)'; return; }
    let k = 0;
    while(lum(r,g,b) < .16 && k < 12){ r += (255-r)*.18; g += (255-g)*.18; b += (255-b)*.18; k++; }
    if(k){ if(!el.hasAttribute('data-kkc')) el.setAttribute('data-kkc', orig); el.style.color = `rgb(${r|0},${g|0},${b|0})`; }
  });
}
// Keep chord-over-lyric alignment (no wrapping): shrink the font until the
// widest line fits, down to 11 px; past that the box scrolls sideways.
// ---- chart layout: nothing may be clipped on a phone ----
// 1) shrink the font until the widest line fits (down to 8 px on narrow screens,
//    11 px on desktop); 2) if a line still does not fit, wrap it - a chord line and
//    the lyric line under it are wrapped together at the same column, so chords stay
//    over the right syllables. Wrapping is display-only; the saved chart is untouched.
let chartOrigHtml = null;
const CHART_NARROW = 600;
function chartInnerWidth(box){ const cs = getComputedStyle(box); return box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight); }
const BLOCK_SEL = 'div,p,pre,section,article,table,ul,ol,li,h1,h2,h3,h4,h5,h6,blockquote';
// Line elements = blocks with no block children (charts are mostly one <div> per line,
// some are wrapped in an extra container or use <p>).
function chartLines(box){
  const out = [];
  const walk = el => { for(const c of el.children){ if(c.matches(BLOCK_SEL)){ if(c.querySelector(BLOCK_SEL)) walk(c); else out.push(c); } } };
  walk(box); return out;
}
function lineOver(el){ return el.scrollWidth > el.clientWidth + 1; }
function chartOverflows(box){ return box.scrollWidth > box.clientWidth + 1 || chartLines(box).some(lineOver); }
function isSimpleLine(el){ return !el.querySelector('br,img,table') && !/\t/.test(el.textContent) && !el.matches('p,li,h1,h2,h3,h4,h5,h6'); }
function fitChart(box, size){
  let fs = Number(size)||19, start = fs, guard = 0;
  const minFs = box.clientWidth < CHART_NARROW ? 8 : 11;
  box.style.fontSize = fs + 'px';
  while(chartOverflows(box) && fs > minFs && guard++ < 40){ fs -= 1; box.style.fontSize = fs + 'px'; }
  return fs !== start;
}
function lineText(el){ return el.textContent.replace(/\n/g,''); }
function isChordLine(el){
  if(!el.querySelector || !el.querySelector('.ch')) return false;
  const c = el.cloneNode(true); c.querySelectorAll('.ch').forEach(x => x.remove());
  return /^[\s\u00a0|\-–x\d().,:*/]*$/.test(c.textContent);
}
// Clone the character range [start,end) of a line element, keeping its inline markup.
function sliceLine(el, start, end){
  const r = document.createRange();
  const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let pos = 0, n, setS = false, setE = false;
  while((n = tw.nextNode())){
    const t = n.nodeValue.replace(/\n/g,''); const len = n.nodeValue.length;
    if(!setS && start <= pos + t.length){ r.setStart(n, Math.min(len, start - pos)); setS = true; }
    if(setS && end <= pos + t.length){ r.setEnd(n, Math.min(len, end - pos)); setE = true; break; }
    pos += t.length;
  }
  if(!setS) return document.createDocumentFragment();
  if(!setE) r.setEndAfter(el.lastChild);
  return r.cloneContents();
}
function chordSpans(el){
  // [startCol, endCol) of every chord in a chord line
  const out = []; let pos = 0;
  const tw = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n;
  while((n = tw.nextNode())){
    const t = n.nodeValue.replace(/\n/g,'');
    if(n.parentElement && n.parentElement.closest('.ch')) out.push([pos, pos + t.length]);

}
function pickCut(lyric, chords, from, max){
  const hard = from + max;
  for(let c = hard; c > from + Math.floor(max * 0.4); c--){
    const okLyric = !lyric || c >= lyric.length || /[\s\u00a0]/.test(lyric[c-1]) || /[\s\u00a0]/.test(lyric[c]);
    const okChord = !chords.some(([s0,e0]) => s0 < c && c < e0);
    if(okLyric && okChord) return c;
  }
  for(let c = hard; c > from + 1; c--) if(!chords.some(([s0,e0]) => s0 < c && c < e0)) return c;
  return hard;
}
function wrapChart(box){
  const cols = Math.max(12, Math.floor(chartInnerWidth(box) / measureCh(box)) - 1); // -1 for the continuation indent
  const lines = chartLines(box);
  for(let i = 0; i < lines.length; i++){
    const a = lines[i];
    if(!isSimpleLine(a)){ continue; }
    const chordLine = isChordLine(a);
    const nx = lines[i+1];
    const b = chordLine && nx && nx.parentElement === a.parentElement && nx.previousElementSibling === a && isSimpleLine(nx) && !isChordLine(nx) && lineText(nx).trim() ? nx : null;
    const aLen = lineText(a).length, bLen = b ? lineText(b).length : 0;
    if(Math.max(aLen, bLen) <= cols){ if(b) i++; continue; }
    const chords = chordLine ? chordSpans(a) : [];
    const lyricTxt = b ? lineText(b) : (chordLine ? '' : lineText(a));
    const total = Math.max(aLen, bLen);
    const frag = document.createDocumentFragment();
    let from = 0, first = true;
    while(from < total){
      let cut = total - from <= cols ? total : pickCut(lyricTxt, chords, from, cols);
      const mk = (src) => { const d = src.cloneNode(false); const f = sliceLine(src, from, cut); f.querySelectorAll('*').forEach(e => { if(!e.textContent && !e.querySelector('br,img')) e.remove(); }); d.appendChild(f); if(!first) d.classList.add('wrapcont'); return d; };
      frag.appendChild(mk(a));
      if(b) frag.appendChild(mk(b));

      // skip one leading space on continuation lines (in the lyric and the chord line together)
      if(from < total && lyricTxt && /[\s\u00a0]/.test(lyricTxt[from] || '') && !chords.some(([s0]) => s0 === from)) from++;

    }

  chartLines(box).forEach(l => { if(lineOver(l)) l.classList.add('softwrap'); });

// Lay the chart out for the current width. autoFit shrinks the font on narrow screens.

// ---- chart toolbar (replica parity) ----
const SWATCHES = ['#feff0a','#8bff08','#fb0007','#21cbff','#fb00ff','#f5b942','#ff8a00','#f2ede6'];
let chartLocked = true, chartDirty = false, autoTimer = null, autoSpeed = 3, savedRange = null;
function applyChartType(box, size, spacing){

function setChartLocked(locked){

async function saveChart(song, extra){

  await api('/api/songs/'+song.id, {method:'PUT', body: JSON.stringify(body)});

function stopAutoScroll(){

}
function startAutoScroll(){
  const box = $('#chartBox'); if(!box) return;

  // actually see (works the same inside the Wix frame and on its own).
  const tb = $('#toolbar');
  box.style.maxHeight = Math.max(220, (visBottom - visTop) - (tb ? tb.offsetHeight : 0) - 40) + 'px';
  box.style.overflowY = 'auto';
  bringIntoView(tb || box);
  let last = performance.now(), acc = 0;
  const step = now => {
    const dt = (now - last) / 1000; last = now;
    acc += dt * autoSpeed * 9;
    if(acc >= 1){ const px = Math.floor(acc); acc -= px; box.scrollTop += px; }
    if(box.scrollTop + box.clientHeight >= box.scrollHeight - 1){ stopAutoScroll(); toast('End of chart'); return; }
    autoTimer = requestAnimationFrame(step);
  };

  $('#tbScroll').innerHTML = '&#9208; Stop';
}

function renderImport(){

  <h1 style="font-size:32px">SMART IMPORT</h1>
  <p class="lede">One song per line: <b>Title - Artist</b> (or <b>Title | Artist</b>). Songs already on the board are skipped.</p>
  <div class="panel">
    <label>Paste songs</label>
    <textarea id="impText" rows="14" placeholder="500 Miles - The Proclaimers&#10;9 To 5 - Dolly Parton"></textarea>
    <div class="btnrow"><button class="btn" id="impGo">Import</button></div>
    <div id="impResult" style="margin-top:14px"></div>
  </div>`;
  $('#impGo').addEventListener('click', async () => {
    const lines = $('#impText').value.split('\n');
    const seen = new Set(songs.map(s => (s.title+'\u0000'+(s.artist||'')).toLowerCase()));
    let added = 0, skipped = 0;
    for(const raw of lines){
      const line = raw.trim();
      if(!line) continue;
      let title = line, artist = '';
      const pipe = line.indexOf('|');
      if(pipe >= 0){ title = line.slice(0, pipe).trim(); artist = line.slice(pipe+1).trim(); }
      else {
        const m = line.match(/^(.+?)\s+-\s+(.+)$/);
        if(m){ title = m[1].trim(); artist = m[2].trim(); }
      }
      if(!title){ skipped++; continue; }
      const key = (title+'\u0000'+artist).toLowerCase();
      if(seen.has(key)){ skipped++; continue; }
      try{
        await api('/api/songs', {method:'POST', body: JSON.stringify({title, artist, tags: [], minTipCents: 0})});
        seen.add(key); added++;
      }catch(e){ skipped++; }
    }
    await loadSongs();
    $('#impResult').innerHTML = '<p><b>Added '+added+' songs, skipped '+skipped+' already on the board</b></p>';
  });
}

const OVERLAY_URL = 'https://killer-keys-tip-app.onrender.com/?view=overlay';
let overlaySeenExplode = null, overlaySeenIds = null, overlaySeq = 0;
function overlayMarkup(d){
  const q = d.queue || [];
  if(!q.length) return '<div class="ov-empty">No requests in the queue yet</div>';
  return `<div class="ov-title">&#127929; REQUESTS</div>` + q.map((it,i) => `
    <div class="ov-item${i===0?' first':''}"><span class="ov-n">${i===0?'&#9654;':i+1}</span>
      <span class="ov-song">${esc(it.songTitle)}${it.artist?`<span class="ov-artist"> — ${esc(it.artist)}</span>`:''}</span>
      ${it.tipCents?`<span class="ov-tip">$${(it.tipCents/100).toFixed(0)}</span>`:''}</div>`).join('') +
    (d.total > q.length ? `<div class="ov-more">+${d.total - q.length} more</div>` : '');
}
function explode(stage){
  if(!stage) return;
  const layer = document.createElement('div'); layer.className = 'boom';
  const em = ['&#128165;','&#10024;','&#127929;','&#128176;','&#11088;','&#127881;'];
  layer.innerHTML = '<div class="boom-core">&#128165;</div>' + Array.from({length: 36}, (_, i) => {
    const a = (i / 36) * Math.PI * 2, r = 120 + Math.random() * 220;
    return `<span class="p" style="--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r}px;animation-delay:${Math.random()*0.12}s">${em[i % em.length]}</span>`;
  }).join('');
  stage.appendChild(layer);
  setTimeout(() => layer.remove(), 1900);
}
async function fillOverlay(){
  const body = $('#ovBody'); if(!body) return;
  const seq = ++overlaySeq;
  try{
    const d = await api('/api/overlay');
    if(seq !== overlaySeq) return; // a newer refresh already started; drop this stale answer
    body.innerHTML = overlayMarkup(d);
    const stage = $('#ovStage');
    if(overlaySeenExplode !== null && d.explodeAt > overlaySeenExplode) explode(stage);
    const tipped = (d.queue || []).filter(x => x.tipCents > 0).map(x => x.id);
    if(overlaySeenIds && tipped.some(id => !overlaySeenIds.has(id))) explode(stage);
    overlaySeenExplode = d.explodeAt; overlaySeenIds = new Set(tipped);
  }catch(e){ body.innerHTML = '<div class="ov-empty">Could not load the queue (' + esc(e.message) + ')</div>'; }
}
async function renderOverlay(){
  overlaySeenExplode = null; overlaySeenIds = null;
  // Full-screen, transparent mode when the overlay URL is opened on its own (OBS / Ecamm browser source).
  const solo = !EMBEDDED && new URLSearchParams(location.search).get('view') === 'overlay';
  if(solo){
    document.body.classList.add('ov-solo');
    main.innerHTML = `<div class="ov-stage solo" id="ovStage"><div id="ovBody"></div></div>`;
  } else {
    let st = {}; try{ st = (await api('/api/settings')).settings || {}; }catch(e){}
    main.innerHTML = `
    <h1 style="font-size:32px">STREAM <span>OVERLAY</span></h1>
    <div class="ovgrid">
      <div>
        <h2 style="font-size:18px;margin:0 0 8px">Live preview</h2>
        <div class="ov-stage" id="ovStage"><div id="ovBody"><div class="ov-empty">Loading queue…</div></div></div>
        <p class="small">Updates every 3 seconds. Tipped requests go to the top and set off the explosion.</p>
      </div>
      <div class="panel">
        <label for="ovVisible">Visible requests: <b id="ovVisibleV">${esc(st.overlayVisible||3)}</b></label>
        <input type="range" id="ovVisible" min="1" max="10" value="${esc(st.overlayVisible||3)}" style="width:100%">
        <div class="btnrow"><button class="btn" id="ovExplode">&#128165; Test explosion</button></div>
        <hr>
        <h2 style="font-size:18px">Browser source for Ecamm / OBS</h2>
        <label for="ovPublic">Public address</label>
        <input type="text" id="ovPublic" value="${esc(st.overlayPublicUrl||OVERLAY_URL)}">
        <div class="btnrow"><button class="btn" id="ovSave">Save</button><button class="btn ghost" id="ovCopy">Copy</button><button class="btn ghost" id="ovOpen">Open</button></div>
        <p class="small">Ecamm Live: Overlays &rsaquo; + &rsaquo; Browser/Web. OBS: Sources &rsaquo; + &rsaquo; Browser, 1920&times;1080. The background is transparent.</p>
      </div>
    </div>`;
    let tVis = null;
    $('#ovVisible').addEventListener('input', e => {
      $('#ovVisibleV').textContent = e.target.value; clearTimeout(tVis); overlaySeq++;
      tVis = setTimeout(async () => { await api('/api/settings', {method:'PUT', body: JSON.stringify({overlayVisible: Number(e.target.value)})}); fillOverlay(); toast('Showing ' + e.target.value + ' requests on the overlay'); }, 350);
    });
    $('#ovExplode').addEventListener('click', async () => {
      explode($('#ovStage'));
      try{ const r = await api('/api/overlay/explode', {method:'POST'}); overlaySeenExplode = r.explodeAt; toast('Explosion sent to the stream overlay'); }
      catch(e){ toast('Preview only — could not reach the stream overlay: ' + e.message, true); }
    });
    $('#ovSave').addEventListener('click', async () => {
      try{ const r = await api('/api/settings', {method:'PUT', body: JSON.stringify({overlayPublicUrl: $('#ovPublic').value})}); $('#ovPublic').value = r.settings.overlayPublicUrl; toast('Public address saved'); }
      catch(e){ toast('Save failed: ' + e.message, true); }
    });
    $('#ovCopy').addEventListener('click', async () => {
      const u = $('#ovPublic').value;
      try{ await navigator.clipboard.writeText(u); toast('Address copied'); }
      catch(e){ const inp = $('#ovPublic'); inp.focus(); inp.select(); toast('Address selected — press Cmd+C / Ctrl+C to copy'); }
    });
    $('#ovOpen').addEventListener('click', () => { const w = window.open($('#ovPublic').value, '_blank', 'noopener'); if(!w) toast('Pop-up blocked — copy the address instead.', true); });
  }
  fillOverlay();
  if(overlayTimer) clearInterval(overlayTimer);
  overlayTimer = setInterval(fillOverlay, 3000);
}

async function loadSongs(){
  try{ const d = await api('/api/songs?visible=0'); songs = d.songs || []; }
  catch(e){ songs = []; main.innerHTML = '<p class="lede" style="padding:30px 0">Could not load songs: '+esc(e.message)+' <button class="btn" onclick="location.reload()">Tap to retry</button></p>'; }
}

function setView(v){
  stopAutoScroll();
  view = v; currentSetlist = null; makerSetlist = null;
  if(overlayTimer){ clearInterval(overlayTimer); overlayTimer = null; }
  const nav = document.getElementById('topnav');
  const solo = v==='overlay' && !EMBEDDED && new URLSearchParams(location.search).get('view') === 'overlay';
  if(nav) nav.style.display = solo ? 'none' : '';
  document.querySelectorAll('#topnav button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  if(v==='board') renderBoard();
  else if(v==='qr') renderQR();
  else if(v==='add') renderAdd();
  else if(v==='import') renderImport();
  else if(v==='queue') renderQueue();
  else if(v==='maker') renderMaker();
  else if(v==='setlists') renderSetlists();
  else if(v==='mod') renderMod();
  else if(v==='overlay') renderOverlay();
  else if(v==='notes') renderNotes();
  freshView();
}

document.querySelectorAll('#topnav button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));


(async function init(){
  await loadSongs();
  lastSync = new Date();
  const v = new URLSearchParams(location.search).get('view');
  if (v && ['board','qr','add','import','queue','maker','setlists','mod','overlay','notes'].includes(v)) setView(v);
  else renderBoard();
})();
</script>
</body>
</html>
