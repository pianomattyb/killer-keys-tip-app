<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>The Killer Keys · Request a Song</title>
<style>
:root{color-scheme:dark;--bg:#0a0a0c;--bg2:#101013;--panel:#15151a;--panel2:#1c1c22;--line:#2a2a33;--ink:#f4efe4;--dim:#a9a294;--faint:#6f6a5e;--gold:#f0b429;--gold-deep:#c98f0e;--red:#e5484d;--green:#3fb970;--radius:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.wrap{max-width:720px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
header.top{position:sticky;top:0;z-index:20;background:rgba(10,10,12,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left))}
.brand{max-width:720px;margin:0 auto;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand .keys{font-size:22px;font-weight:900;letter-spacing:.06em;line-height:1}
.brand .keys b{color:var(--gold)}
.brand .sub{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700}
h1.page{font-size:clamp(36px,10vw,56px);font-weight:900;letter-spacing:.01em;line-height:.95;margin:20px 0 14px;text-transform:uppercase}
h1.page em{font-style:normal;color:var(--gold)}
.tools{position:sticky;top:var(--hdr,52px);z-index:10;background:var(--bg);padding:8px 0 10px;margin:0 -2px;display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:0 6px 0 14px;min-height:48px}
.search input{flex:1;background:transparent;border:0;outline:0;color:var(--ink);font-size:16px;padding:12px 0;min-width:0}
.search input::placeholder{color:var(--faint)}
.search-clear{flex:none;width:36px;height:36px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);color:var(--dim);font-size:14px;padding:0}
.chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:0 15px;min-height:44px;font-size:14px;font-weight:700;white-space:nowrap}
.chips button.active{background:var(--gold);border-color:var(--gold);color:#0a0a0c}
.song-list{display:flex;flex-direction:column;gap:8px}
.song{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;text-align:left;width:100%;color:var(--ink);min-height:60px}
.song:active{border-color:var(--gold-deep);background:var(--panel2)}
.song .meta{flex:1;min-width:0}
.song .title-row{display:flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap}
.song .title{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.song .artist{font-size:13.5px;color:var(--dim);margin-top:2px;display:block;overflow-wrap:anywhere}
.era{font-size:10.5px;font-weight:800;letter-spacing:.08em;border:1px solid;border-radius:6px;padding:2px 6px;flex:none;display:inline-flex;align-items:center;height:20px;text-transform:uppercase}
.era.e50s{color:#9ad0ff;border-color:#244766;background:rgba(154,208,255,.08)}
.era.e60s{color:#39c2d7;border-color:#1d4a52;background:rgba(57,194,215,.10)}
.era.e70s{color:#ff9a3d;border-color:#5a3a14;background:rgba(255,154,61,.10)}
.era.e80s{color:#ff6fa5;border-color:#5c2440;background:rgba(255,111,165,.10)}
.era.e90s{color:#5fd68a;border-color:#1f4a30;background:rgba(95,214,138,.10)}
.era.ecountry{color:#e0aa6e;border-color:#5f421f;background:rgba(214,164,96,.12)}
.era.e2000s{color:#64b5ff;border-color:#274a73;background:rgba(100,181,255,.10)}
.era.e2010s{color:#f9e04d;border-color:#5f5514;background:rgba(249,224,77,.10)}
.era.e2020s{color:#b8f135;border-color:#44600f;background:rgba(184,241,53,.10)}
.era.emed{color:#b79cff;border-color:#3d2f66;background:rgba(150,120,255,.12)}
.era.ebang{color:#ffd76a;border-color:#5a4a14;background:rgba(240,180,41,.12)}
.min-badge{flex:none;font-size:13px;font-weight:800;color:#0a0a0c;background:var(--green);border-radius:8px;padding:5px 9px;white-space:nowrap;text-align:center}
.min-badge small{display:block;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.min-badge.global{background:#2a2410;color:var(--gold);border:1px solid #4a3808}
.req-arrow{flex:none;color:var(--gold);font-size:22px;font-weight:700}
.no-results{color:var(--faint);text-align:center;padding:30px 6px;font-size:15px;line-height:1.5}
.board-cards{display:grid;grid-template-columns:1fr;gap:10px;margin-top:20px}
.board-card{background:var(--panel);border:1px dashed #3d3d49;border-radius:var(--radius);padding:16px;text-align:left;color:var(--ink);width:100%;min-height:60px}
.board-card h3{margin:0 0 4px;font-size:17px}
.board-card p{margin:0;color:var(--dim);font-size:14px;line-height:1.45}
@media (min-width:641px){.board-cards{grid-template-columns:1fr 1fr}}
.back-btn{background:transparent;border:0;color:var(--gold);font-size:16px;font-weight:700;padding:14px 0;min-height:44px}
.req-song,.love-box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.love-box{margin-top:12px}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700}
.req-song h2{margin:6px 0 2px;font-size:26px;overflow-wrap:anywhere}
.req-song .artist{color:var(--dim);font-size:15px}
.field{margin-top:16px}
.field label{display:block;font-size:13.5px;font-weight:700;letter-spacing:.03em;margin-bottom:7px}
.field label span{color:var(--faint);font-weight:500}
.field input,.field textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:16px;padding:12px 13px;outline:0;min-height:48px;font-family:inherit}
.field input:focus,.field textarea:focus,.custom-tip:focus-within{border-color:var(--gold-deep)}
.field textarea{resize:vertical;min-height:72px}
.love-box h3{margin:0;font-size:20px}
.love-box h3 .heart{color:var(--red)}
.love-box .sub{color:var(--dim);font-size:14px;margin:6px 0 0;line-height:1.5}
.tip-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.tip-grid button{background:var(--bg2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 4px;min-height:56px;font-size:17px;font-weight:800}
.tip-grid button.sel{background:var(--gold);border-color:var(--gold);color:#0a0a0c}
.tip-grid button small{display:block;font-size:10.5px;font-weight:600;opacity:.75;margin-top:2px}
.custom-tip{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:0 13px;min-height:48px}
.custom-tip span{color:var(--dim);font-weight:700}
.custom-tip input{flex:1;background:transparent;border:0;outline:0;color:var(--ink);font-size:16px;padding:12px 0;min-width:0}
.tip-error{color:#ff8a8e;font-size:14px;margin-top:10px;line-height:1.45}
.tip-error:empty{display:none}
.send-btn{width:100%;margin-top:16px;background:var(--gold);color:#0a0a0c;border:0;border-radius:12px;padding:16px;min-height:54px;font-size:17px;font-weight:800}
.send-btn:disabled{opacity:.5}
.sent-box{text-align:center;padding:30px 12px}
.sent-box .check{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:#12351f;border:2px solid var(--green);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}
.sent-box h3{margin:0 0 8px;font-size:24px}
.sent-box p{color:var(--dim);line-height:1.55;margin:0 auto 18px;max-width:420px}
.btn-gold{background:var(--gold);color:#0a0a0c;border:0;border-radius:10px;padding:12px 20px;min-height:48px;font-size:16px;font-weight:800}
.fan-return{display:block;width:100%;background:var(--gold);border:1px solid var(--gold);color:#0a0a0c;border-radius:12px;padding:14px 16px;min-height:48px;font-size:16px;font-weight:800;text-align:left;margin:14px 0 10px}
.fan-preview-note{background:rgba(88,243,57,.08);border:1px solid rgba(88,243,57,.45);color:#cdeac2;border-radius:11px;padding:12px 14px;font-size:13.5px;line-height:1.5;margin:0 0 6px}
.fan-preview-note b{color:#8ff07a}
.tag-btn{flex:none;background:var(--bg2);border:1px solid var(--line);color:var(--gold);border-radius:8px;padding:0 10px;min-height:32px;font-size:13px;font-weight:700;white-space:nowrap}
.tag-btn.untagged{background:var(--gold);border-color:var(--gold);color:#0a0a0c}
.tag-editor{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0 2px}
.tag-editor .lbl{display:block;font-size:12.5px;color:var(--dim);margin-bottom:8px}
.tag-editor .chips{flex-wrap:wrap;overflow:visible}
.tag-editor .chips button{min-height:40px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:#1d1d24;border:1px solid var(--gold-deep);color:var(--ink);padding:12px 16px;border-radius:12px;font-weight:700;font-size:14.5px;z-index:400;max-width:calc(100vw - 28px);transition:.25s;pointer-events:none;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fx-canvas{position:fixed;inset:0;z-index:300;pointer-events:none;width:100%;height:100%}
.screen-flash{position:fixed;inset:0;z-index:301;pointer-events:none;opacity:0;border:3px solid #58f339;box-shadow:inset 0 0 38px rgba(88,243,57,.40),inset 0 0 8px rgba(88,243,57,.55)}
.screen-flash.on{animation:screenFlash 2s ease-out forwards}
@keyframes screenFlash{0%{opacity:0}7%{opacity:1}68%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.screen-flash.on{animation:none;opacity:1}}
.social{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.social a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--ink);font-weight:800;font-size:15px;text-decoration:none}
.social a svg{flex:none}
.social a.yt svg{color:#ff3b3b}
.social a.ig svg{color:#ff6fa5}
.loading{color:var(--dim);padding:40px 0;text-align:center}
</style>
</head>
<body>
<canvas id="fx-canvas"></canvas>
<div class="screen-flash" id="flash"></div>
<header class="top" id="hdr"><div class="brand"><span class="keys">THE <b>KILLER KEYS</b></span><span class="sub">Tip &amp; Request App</span></div></header>
<main class="wrap" id="app"><p class="loading">Loading the song board…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/fireworks.js"></script>
<script>
(function(){
'use strict';
const PREVIEW = new URLSearchParams(location.search).get('preview') === '1';
const app = document.getElementById('app');
const TAGS = [['50s','50s'],['60s','60s'],['70s','70s'],['80s','80s'],['90s','90s'],['2000s','2000s'],['2010s','2010s'],['2020s','2020s'],['country','Country'],['medleys','Medleys'],['bangers','Bangers']];
const CHIPS = [['favorites','★ Favorites'],['all','All'],['60s','60s'],['70s','70s'],['80s','80s'],['90s','90s'],['2000s','2000s'],['2010s','2010s'],['2020s','2020s'],['country','Country'],['medleys','Medleys'],['bangers','Bangers']];
const st = { songs:[], globalMin:0, customMin:1000, shoutMin:1000, specialMin:1000, floor:500, viewerSetlists:[], version:'', era:'favorites', q:'', req:null, sent:null, tagOpen:null, scrollY:0 };

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = c => '$' + (Math.round(c)/100).toFixed(2).replace(/\.00$/,'');
const tagKey = t => { const k = String(t||'').toLowerCase().replace(/\s+/g,''); return k === 'medley' ? 'medleys' : k === 'banger' ? 'bangers' : k; };
const eraCls = k => k === 'medleys' ? 'emed' : k === 'bangers' ? 'ebang' : 'e' + k;
const eraLabel = k => (TAGS.find(t => t[0] === k) || [k,k])[1];
let toastT;
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }
async function api(path, opts){
  const r = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts||{}));
  let d = {}; try{ d = await r.json(); }catch(e){}
  if(!r.ok){ const e = new Error(d.error || ('HTTP '+r.status)); e.data = d; throw e; }
  return d;
}
function setHdr(){ document.documentElement.style.setProperty('--hdr', document.getElementById('hdr').offsetHeight + 'px'); }
window.addEventListener('resize', setHdr);

async function load(){
  const d = await api('/api/fan');
  st.songs = d.songs.map(s => Object.assign(s, { tagKeys: (s.tags||[]).map(tagKey) }));
  st.globalMin = d.globalMinCents; st.customMin = d.customMinCents ?? d.specialMinCents ?? 1000; st.shoutMin = d.shoutMinCents ?? d.specialMinCents ?? 1000; st.specialMin = st.customMin; st.floor = d.tipFloorCents;
  st.viewerSetlists = d.viewerSetlists || []; st.version = d.version; st.social = d.social || {};
}

function filtered(){
  const q = st.q.trim().toLowerCase();
  return st.songs.filter(s => {
    if(st.era === 'favorites' && !q && !s.favorite) return false; // typing a search from ★ Favorites looks through the whole board
    if(!['all','favorites'].includes(st.era) && !s.tagKeys.includes(st.era)) return false;
    if(q && !(s.title + ' ' + s.artist).toLowerCase().includes(q)) return false;
    return true;
  });
}

function songRow(s){
  const known = s.tagKeys.filter(k => TAGS.some(t => t[0] === k));
  const badge = s.requiredCents > 0
    ? `<span class="min-badge${s.ownMinCents > 0 ? '' : ' global'}"><small>Min tip</small>${money(s.requiredCents)}</span>` : '';
  return `<div><div class="song" role="button" tabindex="0" data-song="${s.id}" aria-label="Request ${esc(s.title)} by ${esc(s.artist)}">
    <span class="meta"><span class="title-row"><span class="title">${esc(s.title)}</span>${known.map(k => `<span class="era ${eraCls(k)}">${esc(eraLabel(k))}</span>`).join('')}
    ${PREVIEW ? `<button type="button" class="tag-btn${known.length ? '' : ' untagged'}" data-tag="${s.id}" aria-label="Edit tags for ${esc(s.title)}">Tag${known.length ? '' : ' +'}</button>` : ''}</span>
    <span class="artist">${esc(s.artist)}</span></span>${badge}<span class="req-arrow">›</span></div>
    ${PREVIEW && st.tagOpen === s.id ? `<div class="tag-editor"><span class="lbl">Tags for ${esc(s.title)} — tap to add or remove (saves instantly)</span><div class="chips">${TAGS.map(t => `<button type="button" class="${s.tagKeys.includes(t[0]) ? 'active' : ''}" data-tt="${s.id}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div></div>` : ''}</div>`;
}

function listHTML(){
  const list = filtered();
  let empty = '';
  if(!list.length){
    empty = '<div class="no-results">No matches</div>';
  }
  return `<div class="song-list">${list.map(songRow).join('')}</div>${empty}`;
}


const safeUrl = u => /^https:\/\/[^\s<>"']+$/i.test(String(u||'')) ? u : '';
function socialHTML(){
  const yt = safeUrl(st.social && st.social.youtube), ig = safeUrl(st.social && st.social.instagram);
  if(!yt && !ig) return '';
  return `<div class="social">${yt ? `<a class="yt" href="${esc(yt)}" target="_blank" rel="noopener"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12a31 31 0 0 0 .5 4.8 3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8zM9.8 15.1V8.9l5.4 3.1-5.4 3.1z"/></svg>YouTube</a>` : ''}${ig ? `<a class="ig" href="${esc(ig)}" target="_blank" rel="noopener"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>Instagram</a>` : ''}</div>`;
}
function renderBoard(){
  const n = st.songs.length;
  app.innerHTML = `
  ${PREVIEW ? `<button type="button" class="fan-return" id="backPerf">← Back to performer songbook</button>
    <p class="fan-preview-note"><b>View as Fan</b> — this is exactly what fans see on their phones: no charts, editing or performer tabs, and hidden songs never appear. It refreshes on its own when you change songs, setlists or the Tips setting. One performer-only extra: each row has a <b>Tag</b> button (fans never see it) to fix a song's tags right here.</p>` : ''}
  <h1 class="page">Request a <em>$ong</em></h1>
  ${socialHTML()}
  <div class="tools">
    <div class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6f6a5e" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
      <input type="search" id="q" value="${esc(st.q)}" placeholder="Search songs or artists…" autocomplete="off" autocorrect="off" enterkeyhint="search" aria-label="Search songs or artists">
      <button type="button" class="search-clear" id="qClear" aria-label="Clear search" ${st.q ? '' : 'hidden'}>✕</button></div>
    <div class="chips" role="group" aria-label="Filter songs">${CHIPS.map(c => `<button type="button" data-era="${c[0]}" class="${st.era === c[0] ? 'active' : ''}">${c[1]}</button>`).join('')}</div>
  </div>
  <div id="list">${listHTML()}</div>
  <div class="board-cards">
    <button type="button" class="board-card" data-special="custom"><h3>Don’t see your song?</h3></button>
    <button type="button" class="board-card" data-special="shoutout"><h3>Just a shout-out</h3></button>
  </div>`;
  setHdr();
  const q = document.getElementById('q');
  q.addEventListener('input', () => { st.q = q.value; document.getElementById('qClear').hidden = !st.q; refreshList(); });
  q.addEventListener('keydown', e => { if(e.key === 'Enter') q.blur(); });
  document.getElementById('qClear').addEventListener('click', () => { st.q = ''; q.value = ''; document.getElementById('qClear').hidden = true; refreshList(); q.focus(); });
  app.querySelectorAll('[data-era]').forEach(b => b.addEventListener('click', () => {
    st.era = b.dataset.era; app.querySelectorAll('[data-era]').forEach(x => x.classList.toggle('active', x === b));
    b.scrollIntoView({inline:'nearest', block:'nearest'}); refreshList();
  }));
  app.querySelectorAll('[data-special]').forEach(b => b.addEventListener('click', () => openReq({ mode: b.dataset.special })));
  const back = document.getElementById('backPerf');
  if(back) back.addEventListener('click', () => { try{ parent.postMessage({ kk: 'closeFan' }, '*'); }catch(e){} });
  wireList();
}
function refreshList(){ const l = document.getElementById('list'); if(l){ l.innerHTML = listHTML(); wireList(); } }
function wireList(){
  app.querySelectorAll('#list [data-song]').forEach(el => {
    const go = () => { const s = st.songs.find(x => x.id === Number(el.dataset.song)); if(s) openReq({ mode:'song', song:s }); };
    el.addEventListener('click', e => { if(e.target.closest('.tag-btn')) return; go(); });
    el.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
  });
  app.querySelectorAll('#list [data-tag]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation(); const id = Number(b.dataset.tag); st.tagOpen = st.tagOpen === id ? null : id; refreshList();
  }));
  app.querySelectorAll('#list [data-tt]').forEach(b => b.addEventListener('click', () => toggleTag(Number(b.dataset.tt), b.dataset.t)));
}
let tagChain = Promise.resolve();
function toggleTag(id, key){
  const s = st.songs.find(x => x.id === id); if(!s) return;
  const label = eraLabel(key);
  const had = s.tagKeys.includes(key);
  const tags = had ? s.tags.filter(t => tagKey(t) !== key) : s.tags.concat([label]);
  s.tags = tags; s.tagKeys = tags.map(tagKey); refreshList();
  tagChain = tagChain.then(() => api('/api/songs/' + id, { method:'PUT', body: JSON.stringify({ tags }) }))
    .then(() => toast(had ? `Tag removed — ${label} is off “${s.title}”` : `Tag applied — ${label} is on “${s.title}”`))
    .catch(e => toast('Tag didn’t save — ' + e.message));
}

/* ---------- request flow ---------- */
function needFor(req){ return req.mode === 'song' ? req.song.requiredCents : req.mode === 'custom' ? st.customMin : st.shoutMin; }
function openReq(req){
  st.scrollY = window.scrollY; st.req = req; st.sent = null;
  const need = needFor(req);
  req.tipSel = need > 0 ? need : 0; req.customTip = need > 0 ? String(need/100) : '';
  req.name = ''; req.msg = ''; req.customText = '';
  renderReq(); window.scrollTo(0, 0);
}
function closeReq(){
  const id = st.req && st.req.song ? st.req.song.id : null;
  st.req = null; st.sent = null; renderBoard();
  const row = id && app.querySelector(`[data-song="${id}"]`);
  if(row){ row.scrollIntoView({ block:'center' }); } else window.scrollTo(0, st.scrollY);
}
function tipButtons(req){
  const need = needFor(req);
  if(need > 0){
    const own = req.mode === 'song' && req.song.ownMinCents > 0;
    return [{ v:need, label:money(need) }]
      .concat([2000, 5000, 10000].filter(a => a > need).slice(0, 2).map(a => ({ v:a, label:money(a) })))
      .concat([{ v:'custom', label:'Other' }]);
  }
  return [{ v:0, label:'No tip' }, { v:500, label:'$5' }, { v:1000, label:'$10' }, { v:2000, label:'$20' }, { v:5000, label:'$50' }, { v:'custom', label:'Other' }];
}
function tipCents(req){
  if(req.tipSel !== 'custom') return req.tipSel;
  if(req.customTip === '') return null;
  const v = Math.round(parseFloat(req.customTip) * 100); return isNaN(v) ? null : v;
}
function renderReq(){
  const req = st.req, need = needFor(req);
  const title = req.mode === 'song' ? req.song.title : req.mode === 'custom' ? 'Custom request' : 'Shout-out';
  const artist = req.mode === 'song' ? req.song.artist : '';
  app.innerHTML = `
  <button type="button" class="back-btn" id="back">← Back to the song board</button>
  <div class="req-song">
    <h2>${esc(title)}</h2>${artist ? `<div class="artist">${esc(artist)}</div>` : ''}
    ${req.mode === 'custom' ? `<div class="field"><label for="customText">Song &amp; artist you want</label><input type="text" id="customText" value="${esc(req.customText)}" placeholder="e.g. Piano Man — Billy Joel" autocomplete="off" enterkeyhint="next"></div>` : ''}
    <div class="field"><label for="fanName">Your name</label><input type="text" id="fanName" value="${esc(req.name)}" placeholder="e.g. Dana from Winnipeg" autocomplete="given-name" enterkeyhint="next" maxlength="60"></div>
    <div class="field"><label for="fanMsg">${req.mode === 'shoutout' ? 'Your shout-out' : 'Message'}</label><textarea id="fanMsg" placeholder="e.g. For my wife — it's our 20th anniversary tonight!" maxlength="300">${esc(req.msg)}</textarea></div>
  </div>
  <div class="love-box" id="tipStep">${st.sent ? sentHTML() : `
    <h3><span class="heart">❤</span> Show some love</h3>
    <div class="tip-grid">${tipButtons(req).map((b, i) => `<button type="button" data-tip="${b.v}" class="${req.tipSel === b.v ? 'sel' : ''}">${b.label}</button>`).join('')}</div>
    ${req.tipSel === 'custom' ? `<div class="custom-tip"><span>$</span><input type="text" inputmode="decimal" id="customTip" value="${esc(req.customTip)}" placeholder="Amount" aria-label="Custom tip amount"></div>` : ''}
    <div class="tip-error" id="err" role="alert"></div>
    <button type="button" class="send-btn" id="send">${sendLabel(req)}</button>`}
  </div>`;
  document.getElementById('back').addEventListener('click', closeReq);
  const bind = (id, key) => { const el = document.getElementById(id); if(el) el.addEventListener('input', () => { req[key] = el.value; }); };
  bind('customText','customText'); bind('fanName','name'); bind('fanMsg','msg');
  if(st.sent){ wireSent(); return; }
  app.querySelectorAll('[data-tip]').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.tip; req.tipSel = v === 'custom' ? 'custom' : Number(v); renderTipOnly();
    if(v === 'custom'){ const ct = document.getElementById('customTip'); if(ct) ct.focus(); }
  }));
  const ct = document.getElementById('customTip');
  if(ct){
    ct.addEventListener('input', () => { ct.value = ct.value.replace(/[^0-9.]/g, ''); req.customTip = ct.value; document.getElementById('send').textContent = sendLabel(req); });
    ct.addEventListener('blur', () => { const v = parseFloat(req.customTip); if(need > 0 && !isNaN(v) && v * 100 < need){ req.customTip = String(need/100); ct.value = req.customTip; showErr(`Minimum tip ${money(need)}`); document.getElementById('send').textContent = sendLabel(req); } });
  }
  document.getElementById('send').addEventListener('click', send);
}
function renderTipOnly(){ const y = window.scrollY; renderReq(); window.scrollTo(0, y); }
function sendLabel(req){ const t = tipCents(req); return t && t > 0 ? `Send request · tip ${money(t)}` : 'Send request'; }
function showErr(m){ const e = document.getElementById('err'); if(e){ e.textContent = m; } }
async function send(){
  const req = st.req, need = needFor(req), t = tipCents(req);
  showErr('');
  if(req.mode === 'custom' && !req.customText.trim()) return showErr('Enter the song and artist.');
  if(req.tipSel === 'custom' && t == null) return showErr('Enter a tip amount.');
  if(need > 0 && (!t || t < need)) return showErr(`Minimum tip ${money(need)}`);
  if(need === 0 && t && t > 0 && t < st.floor) return showErr('Minimum tip $5');
  const btn = document.getElementById('send'); btn.disabled = true; btn.textContent = 'Sending…';
  try{
    const body = { kind: req.mode, songId: req.mode === 'song' ? req.song.id : null, songTitle: req.mode === 'song' ? req.song.title : '',
      customText: req.customText, requester: req.name.trim(), message: req.msg.trim(), tipCents: t || 0 };
    const d = await api('/api/queue', { method:'POST', body: JSON.stringify(body) });
    st.sent = { title: req.mode === 'song' ? req.song.title : req.mode === 'custom' ? req.customText.trim() : 'Shout-out', tip: t || 0, id: d.item.id };
    const box = document.getElementById('tipStep');
    box.classList.add('sent-box'); box.innerHTML = sentHTML(); wireSent();
    box.scrollIntoView({ block:'center', behavior:'smooth' });
    celebrate(box, st.sent.tip > 0);
    toast('Request sent!');
  }catch(e){
    btn.disabled = false; btn.textContent = sendLabel(req);
    if(e.data && e.data.requiredCents !== undefined){ await load().catch(() => {}); }
    showErr(e.message === 'Failed to fetch' ? 'No connection — check your signal and tap Send again.' : e.message);
  }
}
function sentHTML(){
  const s = st.sent;
  return `<div class="check">✓</div><h3>You’re in!</h3>
    <p><b>${esc(s.title)}</b>${s.tip > 0 ? ` · ${money(s.tip)} tip` : ''}</p>
    <button type="button" class="btn-gold" id="again">Request another</button>`;
}
function wireSent(){ const a = document.getElementById('again'); if(a) a.addEventListener('click', closeReq); }
function celebrate(anchor, big){
  try{ KKFireworks.screenFlash(document.getElementById('flash')); KKFireworks.fireworksOnElement(anchor, big); }catch(e){}
}

/* ---------- live refresh (View as Fan preview, and slow refresh for fans) ---------- */
async function poll(){
  try{
    const d = await api('/api/fan/version');
    if(d.version !== st.version){
      await load();
      if(st.req && st.req.mode === 'song'){
        const fresh = st.songs.find(x => x.id === st.req.song.id);
        if(fresh){ st.req.song = fresh; if(!st.sent){ const need = fresh.requiredCents; if(typeof st.req.tipSel === 'number' && need > 0 && st.req.tipSel < need) st.req.tipSel = need; renderTipOnly(); } }
      } else if(st.req && !st.sent){ renderTipOnly(); }
      else if(!st.req){ const y = window.scrollY; const a = document.activeElement && document.activeElement.id; renderBoard(); window.scrollTo(0, y); if(a === 'q'){ const q = document.getElementById('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
    }
  }catch(e){}
}
window.addEventListener('message', e => { if(e.data && e.data.kk === 'refreshFan') poll(); });

(async function init(){
  try{ KKFireworks.initFireworks(document.getElementById('fx-canvas')); }catch(e){}
  setHdr();
  try{ await load(); renderBoard(); }
  catch(e){ app.innerHTML = `<p class="loading">Could not load the song board. <button class="btn-gold" onclick="location.reload()">Tap to retry</button></p>`; return; }
  setInterval(poll, PREVIEW ? 2000 : 30000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) poll(); });
})();
})();
</script>
</body>
